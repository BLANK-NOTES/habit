<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget · Habit Tracker</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0c0c14;--panel:#121220;--card:#1a1a2e;--border:rgba(255,255,255,0.08);--text:#f0f0f8;--muted:#6b7280;--primary:#4CAF50;}
  [data-theme="light"]  {--bg:#f4f4f8;--panel:#fff;--card:#f0f0f6;--border:rgba(0,0,0,0.1);--text:#111;--muted:#666;}
  [data-theme="pink"]   {--bg:#1a0a14;--panel:#200d18;--card:#2a1020;--border:rgba(255,100,150,0.15);--primary:#f472b6;}
  [data-theme="blue"]   {--bg:#0a1020;--panel:#0d1628;--card:#101e34;--border:rgba(100,160,255,0.12);--primary:#60a5fa;}
  [data-theme="yellow"] {--bg:#14120a;--panel:#1c1908;--card:#26230e;--border:rgba(250,200,20,0.12);--primary:#fbbf24;}
  [data-theme="army"]   {--bg:#0e100a;--panel:#141810;--card:#1c2214;--border:rgba(120,160,80,0.12);--primary:#84cc16;}
  [data-theme="ferrari"]{--bg:#120808;--panel:#1a0c0c;--card:#221010;--border:rgba(255,60,60,0.12);--primary:#ef4444;}

  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px;}
  .header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  .back-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:0.8rem;font-weight:600;text-decoration:none;}
  .page-title{font-size:1rem;font-weight:900;flex:1;}
  .body{max-width:420px;margin:0 auto;padding:18px 14px;}

  /* MAIN RING WIDGET */
  .widget-main{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:24px 20px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;}
  .widget-main::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(76,175,80,0.05),transparent 60%);pointer-events:none;}
  .widget-date{font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;}
  .ring-wrap{position:relative;width:180px;height:180px;margin:0 auto 16px;}
  .ring-svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-bg-circle{fill:none;stroke:var(--card);stroke-width:14;}
  .ring-prog-circle{fill:none;stroke:var(--primary);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 0.8s cubic-bezier(0.34,1.2,0.64,1);}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-pct{font-size:2.4rem;font-weight:900;line-height:1;}
  .ring-sub{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px;}
  .widget-streak{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:6px 14px;font-size:0.82rem;font-weight:700;margin-bottom:12px;}
  .widget-xp{display:flex;align-items:center;gap:8px;font-size:0.72rem;color:var(--muted);}
  .xp-bar{flex:1;height:5px;background:var(--card);border-radius:3px;overflow:hidden;}
  .xp-bar-fill{height:100%;background:var(--primary);border-radius:3px;transition:width 0.5s ease;}

  /* HABIT MINI-LIST */
  .habits-list{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:14px;}
  .habit-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);}
  .habit-row:last-child{border-bottom:none;}
  .habit-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .habit-dot.done{background:#4ade80;}
  .habit-dot.failed{background:#f87171;}
  .habit-dot.unmarked{background:var(--border);}
  .habit-dot.locked{background:transparent;border:1px dashed var(--border);}
  .habit-name{flex:1;font-size:0.85rem;font-weight:600;}
  .habit-name.done{color:var(--muted);text-decoration:line-through;}
  .habit-status{font-size:0.7rem;color:var(--muted);}

  /* QUICK STATS */
  .quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .qs-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
  .qs-val{font-size:1.4rem;font-weight:900;}
  .qs-lbl{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}

  /* CTA */
  .cta{background:var(--primary);color:#fff;display:block;text-align:center;padding:13px;border-radius:14px;font-weight:800;font-size:0.9rem;text-decoration:none;transition:opacity 0.2s;}
  .cta:hover{opacity:0.88;}
</style>
</head>
<body>
<header class="header">
  <a href="monthly.html" class="back-btn">← Home</a>
  <div class="page-title">📱 Daily Widget</div>
</header>
<div class="body">

  <div class="widget-main">
    <div class="widget-date" id="wDate"></div>
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 100 100">
        <circle class="ring-bg-circle"   cx="50" cy="50" r="40"/>
        <circle class="ring-prog-circle" cx="50" cy="50" r="40" id="ringProg"
                stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
      </svg>
      <div class="ring-center">
        <div class="ring-pct" id="ringPct">0%</div>
        <div class="ring-sub">Today</div>
      </div>
    </div>
    <div class="widget-streak" id="wStreak">🔥 — day streak</div>
    <div class="widget-xp">
      <span id="wXpLabel">Level 1</span>
      <div class="xp-bar"><div class="xp-bar-fill" id="wXpBar" style="width:0%"></div></div>
      <span id="wXpPct">0%</span>
    </div>
  </div>

  <!-- HABITS LIST -->
  <div class="habits-list" id="habitsList"></div>

  <!-- QUICK STATS -->
  <div class="quick-stats" id="quickStats"></div>

  <!-- CTA -->
  <a href="monthly.html" class="cta">Open Full Dashboard →</a>

</div>
<script>
  const authUser = JSON.parse(localStorage.getItem("auth_user"));
  if (!authUser) window.location.href = "auth.html";
  document.body.setAttribute("data-theme", localStorage.getItem("habitTheme") || "dark");

  const STORAGE_KEY = `habitTracker_${authUser.id}`;
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth(), d = today.getDate();
  const mk = `${y}-${String(m+1).padStart(2,"0")}`;
  const month = data[mk] || { tasks:[] };
  const idx   = d - 1;

  /* ── Date ── */
  document.getElementById("wDate").textContent =
    today.toLocaleDateString("en-ZA", {weekday:"long", day:"numeric", month:"long"});

  /* ── Ring ── */
  const active   = month.tasks.filter(t => t.days[idx] !== "locked");
  const done     = active.filter(t => t.days[idx] === "done").length;
  const pct      = active.length > 0 ? Math.round(done / active.length * 100) : 0;
  const circ     = 251.2;
  const offset   = circ - (pct / 100 * circ);
  document.getElementById("ringPct").textContent = pct + "%";
  setTimeout(() => { document.getElementById("ringProg").style.strokeDashoffset = offset; }, 100);

  /* Colour ring based on pct */
  const ring = document.getElementById("ringProg");
  ring.style.stroke = pct >= 80 ? "#4ade80" : pct >= 50 ? "#facc15" : "#f87171";

  /* ── Streak ── */
  const ms = data.streakMilestones || [];
  const streakN = data.loginStreak?.count || 0;
  document.getElementById("wStreak").textContent = `🔥 ${streakN} day streak`;

  /* ── XP ── */
  const xp = data.xp || { level:1, total:0 };
  const XP_PER_LEVEL = n => Math.floor(100 * Math.pow(1.18, n-1));
  const needed = XP_PER_LEVEL(xp.level);
  const xpPct  = Math.min(100, Math.round(xp.total / needed * 100));
  document.getElementById("wXpLabel").textContent = `Level ${xp.level}`;
  document.getElementById("wXpPct").textContent   = `${xpPct}%`;
  setTimeout(() => { document.getElementById("wXpBar").style.width = xpPct + "%"; }, 150);

  /* ── Habits List ── */
  const list = document.getElementById("habitsList");
  if (!month.tasks.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.82rem">No habits for today</div>`;
  } else {
    month.tasks.forEach(t => {
      const s = t.days[idx] || "locked";
      const row = document.createElement("div");
      row.className = "habit-row";
      row.innerHTML = `
        <div class="habit-dot ${s}"></div>
        <div class="habit-name ${s === "done" ? "done" : ""}">${t.name}</div>
        <div class="habit-status">${s === "done" ? "✓" : s === "failed" ? "✗" : s === "locked" ? "—" : ""}</div>`;
      list.appendChild(row);
    });
  }

  /* ── Quick Stats ── */
  // Gems
  const gems = data.gems?.total || 0;
  // Perfect days this month
  let perfectDays = 0;
  const daysInM = new Date(y, m+1, 0).getDate();
  for (let dd=0; dd<Math.min(d, daysInM); dd++) {
    const a2 = month.tasks.filter(t => t.days[dd] !== "locked");
    if (!a2.length) continue;
    if (a2.every(t => t.days[dd] === "done")) perfectDays++;
  }

  document.getElementById("quickStats").innerHTML = `
    <div class="qs-card">
      <div class="qs-val" style="color:#a78bfa">${gems} 💎</div>
      <div class="qs-lbl">Gems</div>
    </div>
    <div class="qs-card">
      <div class="qs-val" style="color:#facc15">⭐ ${perfectDays}</div>
      <div class="qs-lbl">Perfect Days</div>
    </div>`;
</script>
</body>
</html>
