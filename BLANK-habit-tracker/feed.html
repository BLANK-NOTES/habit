<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Feed</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--panel:#111118;--card:#161622;--border:rgba(255,255,255,0.07);--text:#eeeef5;--muted:#6b7280;--primary:#4CAF50;--done:#4ade80;}
[data-theme="light"]{--bg:#f5f6fa;--panel:#fff;--card:#f0f1f8;--border:rgba(0,0,0,0.08);--text:#111827;--muted:#6b7280;--primary:#16a34a;}
[data-theme="pink"]{--bg:#1a0814;--panel:#220d1a;--card:#2c1020;--text:#fce7f3;--muted:#c084a8;--primary:#f472b6;--border:rgba(244,114,182,0.12);}
[data-theme="blue"]{--bg:#060d1a;--panel:#0c1628;--card:#101e34;--text:#dbeafe;--muted:#6b96cc;--primary:#60a5fa;--border:rgba(96,165,250,0.1);}
[data-theme="midnight"]{--bg:#030308;--panel:#080812;--card:#0d0d1c;--text:#ede9fe;--muted:#7c6ba0;--primary:#a78bfa;--border:rgba(167,139,250,0.1);}
[data-theme="ocean"]{--bg:#020c14;--panel:#051422;--card:#081c30;--text:#cffafe;--muted:#4d8fa0;--primary:#06b6d4;--border:rgba(6,182,212,0.1);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;}
.header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10;}
.back{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:0.78rem;font-weight:700;text-decoration:none;}
.htitle{font-size:0.95rem;font-weight:900;flex:1;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:ldot 2s ease-in-out infinite;box-shadow:0 0 6px #4ade80;}
@keyframes ldot{0%,100%{opacity:1}50%{opacity:0.3}}
.feed{padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;}
.event{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 14px;display:flex;align-items:flex-start;gap:11px;animation:ein 0.35s ease;}
@keyframes ein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.ev-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;background:var(--card);border:1px solid var(--border);}
.ev-body{flex:1;min-width:0;}
.ev-text{font-size:0.83rem;line-height:1.5;}
.ev-text strong{font-weight:800;}
.ev-time{font-size:0.68rem;color:var(--muted);margin-top:3px;}
.ev-icon{font-size:1.1rem;flex-shrink:0;align-self:center;}
.tab-bar{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);}
.tab{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 14px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}
.empty-title{font-size:0.95rem;font-weight:800;margin-bottom:6px;color:var(--text);}
.empty-sub{font-size:0.8rem;line-height:1.5;}
</style>
<script src="habitSecurity.js"></script>
</head>
<body>
<header class="header">
  <a href="monthly.html" class="back">&#8592; Home</a>
  <div class="htitle">Activity Feed</div>
  <div class="live-dot" title="Live"></div>
</header>
<div class="tab-bar">
  <button class="tab active" onclick="showTab('all',this)">All</button>
  <button class="tab" onclick="showTab('friends',this)">Friends</button>
  <button class="tab" onclick="showTab('mine',this)">Mine</button>
</div>
<div class="feed" id="feed"></div>

<script>
  const _hs = window.HabitSecurity || {};

const au=JSON.parse(localStorage.getItem("auth_user")||"null");
if(!au) location.href="auth.html";
document.body.setAttribute("data-theme",localStorage.getItem("habitTheme")||"dark");

// Gather real activity from self
const buildMyActivity=()=>{
  const raw=JSON.parse(localStorage.getItem("habitTracker_"+au.id)||"{}");
  const today=new Date();
  const mk=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
  const mo=raw[mk]||{tasks:[]};
  const events=[];
  const todayIdx=today.getDate()-1;
  mo.tasks.forEach(t=>{
    if(t.days[todayIdx]==="done"){
      events.push({type:"done",user:au.displayName||au.username,avatar:au.profile?.avatar||"&#x1F642;",habit:t.name,time:Date.now()-Math.random()*3600000,mine:true});
    }
  });
  const ls=raw.loginStreak||{count:0};
  if(ls.count>1) events.push({type:"streak",user:au.displayName||au.username,avatar:au.profile?.avatar||"&#x1F642;",streak:ls.count,time:Date.now()-1800000,mine:true});
  const xp=raw.xp||{level:1};
  if(xp.level>1) events.push({type:"level",user:au.displayName||au.username,avatar:au.profile?.avatar||"&#x1F642;",level:xp.level,time:Date.now()-7200000,mine:true});
  return events;
};

// Gather friend activity
const buildFriendActivity=()=>{
  const events=[];
  const friends=JSON.parse(localStorage.getItem("habitFriends_"+au.id)||"[]");
  friends.slice(0,10).forEach(fid=>{
    const fu=JSON.parse(localStorage.getItem("habitTracker_users")||"{}")[fid];
    if(!fu) return;
    const fdata=JSON.parse(localStorage.getItem("habitTracker_"+fid)||"{}");
    const today=new Date();
    const mk=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
    const mo=fdata[mk]||{tasks:[]};
    const todayIdx=today.getDate()-1;
    let doneCnt=0;
    mo.tasks.forEach(t=>{if(t.days[todayIdx]==="done")doneCnt++;});
    if(doneCnt>0) events.push({type:"friend_done",user:fu.displayName||fu.username,avatar:fu.profile?.avatar||"&#x1F600;",count:doneCnt,time:Date.now()-Math.random()*14400000,mine:false,userId:fid});
    const fls=fdata.loginStreak||{count:0};
    if(fls.count>=7&&Math.random()>.5) events.push({type:"streak",user:fu.displayName||fu.username,avatar:fu.profile?.avatar||"&#x1F600;",streak:fls.count,time:Date.now()-Math.random()*86400000,mine:false});
  });
  return events;
};

// Simulated community events (makes it feel alive even with no friends)
const buildCommunityEvents=()=>{
  const names=["Alex","Sam","Jordan","Riley","Morgan","Taylor","Casey","Drew","Jamie","Blake"];
  const habNames=["Morning workout","Read 20 pages","Meditate","Drink 2L water","Journal","10,000 steps","Cold shower","No phone morning"];
  const events=[];
  for(let i=0;i<8;i++){
    const name=names[~~(Math.random()*names.length)];
    const habit=habNames[~~(Math.random()*habNames.length)];
    const type=Math.random()>.7?"streak":"done";
    events.push({
      type,user:name,avatar:["&#x1F642;","&#x1F60A;","&#x1F604;","&#x1F600;","&#x1F603;"][~~(Math.random()*5)],
      habit,streak:~~(Math.random()*30)+3,
      time:Date.now()-Math.random()*86400000,mine:false,simulated:true
    });
  }
  return events;
};

let currentTab="all";
let allEvents=[];

const fmt=ms=>{
  const s=Math.round((Date.now()-ms)/1000);
  if(s<60)return"just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return"Yesterday";
};

const icons={done:"&#x2705;",streak:"&#x1F525;",level:"&#x26A1;",friend_done:"&#x1F44F;",badge:"&#x1F3C6;"};

const renderEvent=ev=>{
  const d=document.createElement("div");
  d.className="event";
  let text="";
  if(ev.type==="done") text=`<strong>${(_hs.escapeHTML||String)(ev.user||"")}</strong> completed <strong>${(_hs.escapeHTML||String)(ev.habit||"")}</strong>`;
  else if(ev.type==="friend_done") text=`<strong>${(_hs.escapeHTML||String)(ev.user||"")}</strong> completed ${sanitizeInt(ev.count||0)} habit${ev.count>1?"s":""} today`;
  else if(ev.type==="streak") text=`<strong>${(_hs.escapeHTML||String)(ev.user||"")}</strong> is on a <strong>${sanitizeInt(ev.streak||0)}-day streak</strong> &#x1F525;`;
  else if(ev.type==="level") text=`<strong>${(_hs.escapeHTML||String)(ev.user||"")}</strong> reached <strong>Level ${sanitizeInt(ev.level||0)}</strong>`;
  else if(ev.type==="badge") text=`<strong>${(_hs.escapeHTML||String)(ev.user||"")}</strong> earned the <strong>${(_hs.escapeHTML||String)(ev.badge||"")}</strong> badge`;
  d.innerHTML=`<div class="ev-avatar">${ev.avatar}</div><div class="ev-body"><div class="ev-text">${text}</div><div class="ev-time">${fmt(ev.time)}${ev.simulated?" &middot; community":ev.mine?" &middot; you":""}</div></div><div class="ev-icon">${icons[ev.type]||"&#x2605;"}</div>`;
  return d;
};

const render=()=>{
  const feed=document.getElementById("feed");
  feed.innerHTML="";
  let filtered=allEvents;
  if(currentTab==="friends") filtered=allEvents.filter(e=>!e.mine&&!e.simulated);
  if(currentTab==="mine") filtered=allEvents.filter(e=>e.mine);
  filtered=filtered.sort((a,b)=>b.time-a.time).slice(0,30);
  if(!filtered.length){
    feed.innerHTML=`<div class="empty"><div class="empty-icon">&#x1F441;&#xFE0F;</div><div class="empty-title">${currentTab==="friends"?"No friend activity yet":"Nothing here yet"}</div><div class="empty-sub">${currentTab==="friends"?"Add friends from the social page to see their activity here.":"Complete some habits today to see activity here."}</div></div>`;
    return;
  }
  filtered.forEach(ev=>feed.appendChild(renderEvent(ev)));
};

const showTab=(tab,btn)=>{
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  render();
};
window.showTab=showTab;

// Load all events
allEvents=[...buildMyActivity(),...buildFriendActivity(),...buildCommunityEvents()];
render();

// Simulate live updates
setInterval(()=>{
  const names=["Alex","Sam","Jordan","Riley"];
  const habits=["Morning run","Read 20 pages","Meditation","10k steps"];
  const ev={type:"done",user:names[~~(Math.random()*names.length)],avatar:"&#x1F600;",habit:habits[~~(Math.random()*habits.length)],time:Date.now(),mine:false,simulated:true};
  allEvents.unshift(ev);
  if(currentTab==="all") render();
},45000);
</script>
<script>
// Smart back: if opened from settings, back goes to settings
(function() {
  if (sessionStorage.getItem('settingsReturn') === '1') {
    sessionStorage.removeItem('settingsReturn');
    var backs = document.querySelectorAll('a[href="monthly.html"].back, a[href="monthly.html"].back-btn, .back-btn, .back');
    backs.forEach(function(b) {
      if (b.getAttribute('href') === 'monthly.html') {
        b.href = 'settings.html';
        b.textContent = '← Settings';
      }
    });
  }
})();
</script>
</body>
</html>
