<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var t = localStorage.getItem('habitTheme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.addEventListener('DOMContentLoaded', function() {
    document.body.setAttribute('data-theme', t);
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal · Habit Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--panel:#111118;--card:#161622;--border:rgba(255,255,255,0.08);--text:#eeeef5;--muted:#6b7280;--primary:#4CAF50;--pdim:rgba(76,175,80,0.1);--done:#4ade80;--miss:#f87171;}
[data-theme="light"]{--bg:#f5f6fa;--panel:#fff;--card:#f0f1f8;--border:rgba(0,0,0,0.08);--text:#111827;--muted:#6b7280;--primary:#16a34a;--pdim:rgba(22,163,74,0.08);}
[data-theme="pink"]{--bg:#1a0814;--panel:#220d1a;--card:#2c1020;--border:rgba(244,114,182,0.12);--text:#fce7f3;--muted:#c084a8;--primary:#f472b6;--pdim:rgba(244,114,182,0.1);}
[data-theme="blue"]{--bg:#060d1a;--panel:#0c1628;--card:#101e34;--border:rgba(96,165,250,0.1);--text:#dbeafe;--muted:#6b96cc;--primary:#60a5fa;--pdim:rgba(96,165,250,0.08);}
[data-theme="yellow"]{--bg:#0f0d00;--panel:#1a1600;--card:#221e00;--border:rgba(251,191,36,0.12);--text:#fef9c3;--muted:#a89020;--primary:#fbbf24;--pdim:rgba(251,191,36,0.08);}
[data-theme="army"]{--bg:#080f08;--panel:#0f1a0f;--card:#152015;--border:rgba(132,204,22,0.1);--text:#d9f0d9;--muted:#6b8a5a;--primary:#84cc16;--pdim:rgba(132,204,22,0.08);}
[data-theme="ferrari"]{--bg:#0f0202;--panel:#1a0404;--card:#220606;--border:rgba(239,68,68,0.12);--text:#fee2e2;--muted:#996060;--primary:#ef4444;--pdim:rgba(239,68,68,0.08);}
[data-theme="midnight"]{--bg:#030308;--panel:#080812;--card:#0d0d1c;--border:rgba(167,139,250,0.1);--text:#ede9fe;--muted:#7c6ba0;--primary:#a78bfa;--pdim:rgba(167,139,250,0.08);}
[data-theme="ocean"]{--bg:#020c14;--panel:#051422;--card:#081c30;--border:rgba(6,182,212,0.1);--text:#cffafe;--muted:#4d8fa0;--primary:#06b6d4;--pdim:rgba(6,182,212,0.08);}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:60px;}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body{animation:pageIn 0.28s cubic-bezier(0.34,1.05,0.64,1) both;}

/* HEADER */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
.back{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:0.78rem;font-weight:700;text-decoration:none;transition:all 0.2s;}
.back:hover{color:var(--text);border-color:var(--primary);}
.htitle{font-size:1rem;font-weight:900;flex:1;}
.streak-badge{background:var(--pdim);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);color:var(--primary);border-radius:10px;padding:5px 11px;font-size:0.75rem;font-weight:800;}

/* TABS */
.tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);}
.tab{flex:1;background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:7px 4px;font-size:0.75rem;font-weight:800;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
[data-theme="yellow"] .tab.active,[data-theme="army"] .tab.active{color:#000;}

/* BODY */
.body{max-width:640px;margin:0 auto;padding:16px 14px;}
.section-title{font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:10px;}

/* MOOD CALENDAR */
.mood-cal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;}
.cal-nav:hover{border-color:var(--primary);color:var(--primary);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dl{text-align:center;font-size:0.55rem;color:var(--muted);font-weight:800;padding-bottom:3px;text-transform:uppercase;}
.cal-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.88rem;cursor:pointer;border:1px solid transparent;transition:all 0.15s;position:relative;}
.cal-cell:hover:not(.empty){border-color:var(--primary);transform:scale(1.08);}
.cal-cell.empty{visibility:hidden;}
.cal-cell.today{border-color:var(--primary)!important;box-shadow:0 0 8px color-mix(in srgb,var(--primary) 35%,transparent);}
.cal-cell.no-mood{background:var(--card);color:var(--muted);font-size:0.6rem;font-weight:700;}
.cal-cell.future{opacity:0.25;cursor:default;pointer-events:none;}

/* MOOD STATS BAR */
.mood-bar-wrap{margin-bottom:16px;}
.mood-bar{display:flex;height:8px;border-radius:6px;overflow:hidden;gap:1px;margin-top:6px;}
.mood-seg{height:100%;transition:flex 0.5s ease;border-radius:2px;}
.mood-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.mood-leg-item{display:flex;align-items:center;gap:4px;font-size:0.68rem;color:var(--muted);}
.mood-dot{width:8px;height:8px;border-radius:50%;}

/* MOOD SUMMARY PILLS */
.mood-pills{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.mood-pills::-webkit-scrollbar{display:none;}
.mood-pill{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center;flex-shrink:0;min-width:68px;}
.mp-emoji{font-size:1.3rem;display:block;}
.mp-count{font-size:1rem;font-weight:900;margin-top:2px;}
.mp-lbl{font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}

/* TODAY'S ENTRY */
.today-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.today-date{font-size:0.75rem;font-weight:800;color:var(--muted);margin-bottom:12px;}
.mood-picker{display:flex;gap:6px;margin-bottom:14px;}
.mpbtn{flex:1;padding:9px 4px;background:var(--card);border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;transition:all 0.2s;font-family:inherit;}
.mpbtn:hover{border-color:color-mix(in srgb,var(--primary) 50%,transparent);transform:translateY(-2px);}
.mpbtn.sel{border-color:var(--primary);background:var(--pdim);}
.mpbtn .me{font-size:1.4rem;display:block;margin-bottom:3px;}
.mpbtn .ml{font-size:0.58rem;color:var(--muted);}

/* PROMPTS */
.prompts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.prompt-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:0.72rem;font-weight:700;cursor:pointer;color:var(--muted);transition:all 0.2s;}
.prompt-chip:hover{border-color:var(--primary);color:var(--primary);}

/* TEXTAREA */
.jtextarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:0.86rem;padding:12px;outline:none;resize:none;min-height:110px;font-family:inherit;line-height:1.6;transition:border-color 0.2s;}
.jtextarea:focus{border-color:var(--primary);}
.entry-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.char-count{font-size:0.68rem;color:var(--muted);}
.char-count.warn{color:#f87171;}
.save-btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-weight:800;font-size:0.83rem;cursor:pointer;font-family:inherit;transition:all 0.2s;box-shadow:0 2px 10px color-mix(in srgb,var(--primary) 35%,transparent);}
.save-btn:hover{transform:translateY(-1px);}
[data-theme="yellow"] .save-btn,[data-theme="army"] .save-btn{color:#000;}

/* INSIGHTS */
.insights-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.ins-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;}
.ins-val{font-size:1.4rem;font-weight:900;color:var(--primary);}
.ins-lbl{font-size:0.68rem;color:var(--muted);margin-top:3px;}
.ins-sub{font-size:0.72rem;color:var(--text);margin-top:4px;font-weight:600;}

/* STREAK GRAPH */
.streak-graph{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;}
.sg-bars{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:8px;}
.sg-bar{flex:1;border-radius:3px 3px 0 0;background:var(--primary);opacity:0.25;transition:all 0.3s;min-height:2px;cursor:pointer;}
.sg-bar.filled{opacity:1;}
.sg-bar.today{opacity:1;box-shadow:0 0 8px color-mix(in srgb,var(--primary) 50%,transparent);}
.sg-bar:hover{opacity:0.8;transform:scaleY(1.05);transform-origin:bottom;}

/* PAST ENTRIES */
.entries-list{display:flex;flex-direction:column;gap:10px;}
.entry-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all 0.2s;animation:eIn 0.3s ease;}
@keyframes eIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.entry-card:hover{border-color:color-mix(in srgb,var(--primary) 30%,transparent);transform:translateY(-1px);}
.entry-card.expanded .entry-body{display:block;}
.entry-header{display:flex;align-items:center;gap:10px;}
.entry-mood-emoji{font-size:1.3rem;flex-shrink:0;}
.entry-meta{flex:1;}
.entry-date-lbl{font-size:0.83rem;font-weight:800;}
.entry-mood-lbl{font-size:0.7rem;font-weight:700;margin-top:1px;}
.entry-preview{font-size:0.75rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.entry-habits{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.ehchip{font-size:0.62rem;padding:2px 8px;border-radius:6px;background:var(--card);border:1px solid var(--border);}
.ehchip.done{border-color:rgba(74,222,128,0.4);color:#4ade80;background:rgba(74,222,128,0.06);}
.ehchip.fail{border-color:rgba(248,113,113,0.4);color:#f87171;background:rgba(248,113,113,0.06);}
.entry-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.entry-full-text{font-size:0.84rem;line-height:1.65;color:var(--text);white-space:pre-wrap;}
.entry-actions{display:flex;gap:8px;margin-top:10px;}
.entry-action-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.entry-action-btn:hover{border-color:var(--primary);color:var(--primary);}
.entry-action-btn.del:hover{border-color:#f87171;color:#f87171;}
.no-entries{text-align:center;padding:36px 20px;color:var(--muted);font-size:0.85rem;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:9px 12px 9px 36px;color:var(--text);font-size:0.84rem;font-family:inherit;outline:none;transition:border-color 0.2s;}
.search-input:focus{border-color:var(--primary);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.9rem;pointer-events:none;}

/* TOAST */
#jToast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel);border:1px solid var(--primary);border-radius:12px;padding:9px 18px;font-size:0.82rem;font-weight:700;color:var(--primary);z-index:9999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
#jToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* PANEL TABS */
.panel{display:none;}
.panel.active{display:block;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 20px;}
.empty-icon{font-size:3rem;margin-bottom:10px;display:block;}
.empty-title{font-size:0.95rem;font-weight:800;margin-bottom:6px;}
.empty-sub{font-size:0.8rem;color:var(--muted);line-height:1.5;}
</style>

<style>
#_byteLoader {
  position: fixed; inset: 0; z-index: 99999;
  background: var(--bg, #0c0c14);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  transition: opacity 0.25s ease;
}
#_byteLoader.done { opacity: 0; pointer-events: none; }
#_byteLoader svg { animation: _loaderPulse 1.2s ease-in-out infinite; }
@keyframes _loaderPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.94)} }
#_loaderDots { display: flex; gap: 6px; }
#_loaderDots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--primary, #4CAF50);
  animation: _dotBounce 1s ease-in-out infinite;
}
#_loaderDots span:nth-child(2) { animation-delay: 0.15s; }
#_loaderDots span:nth-child(3) { animation-delay: 0.30s; }
@keyframes _dotBounce { 0%,100%{opacity:0.3;transform:translateY(0)} 50%{opacity:1;transform:translateY(-5px)} }
</style>

  <svg width="52" height="52" viewBox="0 0 80 80" fill="none">
    <rect width="80" height="80" rx="20" fill="#10b981" opacity="0.15"/>
    <circle cx="40" cy="32" r="18" fill="#10b981"/>
    <circle cx="33" cy="29" r="3.5" fill="white"/>
    <circle cx="47" cy="29" r="3.5" fill="white"/>
    <circle cx="33" cy="29" r="1.8" fill="#065f46"/>
    <circle cx="47" cy="29" r="1.8" fill="#065f46"/>
    <path d="M32 38 Q40 44 48 38" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="24" y="18" width="3" height="8" rx="1.5" fill="#10b981"/>
    <rect x="53" y="18" width="3" height="8" rx="1.5" fill="#10b981"/>
  </svg>
  <div id="_loaderDots"><span></span><span></span><span></span></div>
</div>
<script>
(function() {
  document.body.style.opacity = "0";
  window._pageReady = function() {
    if (window._pageReadyDone) return;
    window._pageReadyDone = true;
    var loader = document.getElementById("_byteLoader");
    if (loader) { loader.classList.add("done"); setTimeout(function(){ loader.remove(); }, 280); }
    document.body.style.transition = "opacity 0.22s ease";
    document.body.style.opacity = "1";
  };
  setTimeout(window._pageReady, 1200);
})();
</script>

</div>

<script>
  const _hs = window.HabitSecurity || {};

const au = JSON.parse(localStorage.getItem("auth_user") || "null");
if (!au) location.href = "auth.html";
document.body.setAttribute("data-theme", localStorage.getItem("habitTheme") || "dark");

// Show journal entry limit for free users
(function() {
  const _hp = window.HabitPremium;
  if (!_hp || _hp.isPremium()) return;
  const thisMonth = new Date().getFullYear() + "-" + String(new Date().getMonth()+1).padStart(2,"0");
  const data2 = JSON.parse(localStorage.getItem("habitTracker_" + JSON.parse(localStorage.getItem("auth_user")||"{}").id) || "{}");
  const entries = data2.journal ? Object.keys(data2.journal).filter(k => k.startsWith(thisMonth)) : [];
  const used = entries.length;
  const max  = _hp.FREE_LIMITS.journalPerMonth;
  const banner = document.getElementById("journalLimitBanner");
  const txt    = document.getElementById("journalLimitText");
  if (banner && txt) {
    banner.style.display = "block";
    if (used >= max) {
      txt.textContent = "Monthly limit reached (" + used + "/" + max + " entries)";
      banner.style.background = "rgba(239,68,68,0.1)";
      banner.style.borderColor = "rgba(239,68,68,0.3)";
      banner.style.color = "#f87171";
    } else {
      txt.textContent = used + "/" + max + " entries used this month";
    }
  }
})();

const KEY = "habitTracker_" + au.id;
let data = JSON.parse(localStorage.getItem(KEY) || "{}");
const save = () => localStorage.setItem(KEY, JSON.stringify(data));
const J = () => { if (!data.journal) data.journal = {}; return data.journal; };
const M = () => { if (!data.moods)   data.moods   = {}; return data.moods; };

const MOODS = [
  { val:5, emoji:"&#x1F929;", label:"Amazing", color:"#4ade80" },
  { val:4, emoji:"&#x1F604;", label:"Good",    color:"#a3e635" },
  { val:3, emoji:"&#x1F610;", label:"Okay",    color:"#fbbf24" },
  { val:2, emoji:"&#x1F614;", label:"Low",     color:"#fb923c" },
  { val:1, emoji:"&#x1F625;", label:"Rough",   color:"#f87171" },
];
const MOOD_MAP = Object.fromEntries(MOODS.map(m => [m.val, m]));

const PROMPTS = [
  "What went well today?", "What was hard today?", "I'm grateful for...",
  "My energy was...", "What I'd do differently...", "Tomorrow I want to...",
  "What surprised me...", "I felt proud when...",
];

const today = new Date();
const todayStr = fmt(today);
let selectedMood = null;
let calOffset = 0; // months back from today

function fmt(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDisplay(dk) {
  const d = new Date(dk + "T12:00:00");
  return d.toLocaleDateString("en-ZA", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
}

/* ── PANEL SWITCHER ── */
function showPanel(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("panel-" + id).classList.add("active");
  btn.classList.add("active");
  if (id === "history")  renderEntries();
  if (id === "insights") renderInsights();
}
window.showPanel = showPanel;

/* ── CALENDAR ── */
function navCal(dir) { calOffset = Math.max(-11, Math.min(0, calOffset + dir)); renderCalendar(); }
window.navCal = navCal;

function renderCalendar() {
  const moods = M();
  const ref = new Date(today.getFullYear(), today.getMonth() + calOffset, 1);
  const y = ref.getFullYear(), m = ref.getMonth();
  const days = new Date(y, m+1, 0).getDate();
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("calTitle").textContent = MONTHS[m] + " " + y;
  const grid = document.getElementById("moodCalGrid");
  const DL = ["M","T","W","T","F","S","S"];
  grid.innerHTML = DL.map(d => `<div class="cal-dl">${d}</div>`).join("");
  for (let i = 0; i < firstDow; i++) grid.innerHTML += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= days; d++) {
    const dk = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const md = moods[dk];
    const isToday = dk === todayStr;
    const isFuture = new Date(dk + "T12:00:00") > today;
    const cell = document.createElement("div");
    cell.className = "cal-cell" + (isToday ? " today" : "") + (isFuture ? " future" : "") + (md ? " has-mood" : " no-mood");
    if (md) {
      const mo = MOOD_MAP[md.val];
      cell.innerHTML = mo ? mo.emoji : d;
      cell.title = (mo?.label || "") + (md.note ? ` — "${md.note}"` : "");
    } else {
      cell.textContent = d;
    }
    if (!isFuture) cell.onclick = () => jumpToEntry(dk);
    grid.appendChild(cell);
  }
}

function jumpToEntry(dk) {
  showPanel("history", document.querySelectorAll(".tab")[1]);
  setTimeout(() => {
    const card = document.getElementById("entry-" + dk);
    if (card) { card.scrollIntoView({ behavior:"smooth", block:"center" }); card.click(); }
  }, 100);
}

/* ── MOOD PICKER ── */
function renderMoodPicker() {
  const existing = M()[todayStr];
  if (existing) selectedMood = existing.val;
  document.getElementById("moodPicker").innerHTML = MOODS.map(m =>
    `<button class="mpbtn ${selectedMood===m.val?"sel":""}" onclick="pickMood(${m.val})">
      <span class="me">${m.emoji}</span><span class="ml">${m.label}</span>
    </button>`
  ).join("");
  const entry = J()[todayStr];
  const ta = document.getElementById("journalText");
  if (entry?.text && !ta.value) ta.value = entry.text;
  updateCharCount();
}

function pickMood(val) { selectedMood = val; renderMoodPicker(); }
window.pickMood = pickMood;

/* ── PROMPTS ── */
function renderPrompts() {
  const picks = PROMPTS.sort(() => 0.5 - Math.random()).slice(0, 4);
  document.getElementById("promptChips").innerHTML = picks.map(p =>
    `<div class="prompt-chip" onclick="usePrompt(this,'${p.replace(/'/g,"&#39;")}')">${p}</div>`
  ).join("");
}
function usePrompt(el, text) {
  const ta = document.getElementById("journalText");
  const cur = ta.value.trim();
  ta.value = cur ? cur + "\n\n" + text + " " : text + " ";
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  el.style.opacity = "0.4";
  el.style.pointerEvents = "none";
  updateCharCount();
}
window.usePrompt = usePrompt;

/* ── DATE LABEL + JOURNAL STREAK ── */
function renderHeader() {
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("todayDateLbl").textContent =
    DAYS[today.getDay()] + ", " + MONS[today.getMonth()] + " " + today.getDate() + " — Today";

  // Journal streak: consecutive days with an entry
  const journal = J();
  let streak = 0;
  const check = new Date(today);
  while (true) {
    const k = fmt(check);
    if (journal[k]) { streak++; check.setDate(check.getDate()-1); }
    else break;
  }
  document.getElementById("journalStreak").textContent = streak + " day" + (streak!==1?"s":"") + " streak";
}

/* ── CHAR COUNT ── */
function onTextInput(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 320) + "px";
  updateCharCount();
}
function updateCharCount() {
  const len = document.getElementById("journalText").value.length;
  const el  = document.getElementById("charCount");
  el.textContent = len + " / 1000";
  el.className = "char-count" + (len > 900 ? " warn" : "");
}

/* ── SAVE ── */
function saveEntry() {
  const text = document.getElementById("journalText").value.trim();
  if (!selectedMood && !text) { toast("Pick a mood or write something first!"); return; }

  // ── PREMIUM GATE: journal entry limit ────────────────────────────
  const _hp = window.HabitPremium;
  if (_hp && !_hp.isPremium()) {
    const thisMonth = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0");
    const monthEntries = Object.keys(J()).filter(k => k.startsWith(thisMonth)).length;
    // Don't count today's existing entry against the limit (it's an edit)
    const isEdit = !!J()[todayStr];
    if (!isEdit && monthEntries >= _hp.FREE_LIMITS.journalPerMonth) {
      _hp.showUpgradeWall("journal");
      return;
    }
  }

  const moods = M(), journal = J();
  if (selectedMood) moods[todayStr] = { val:selectedMood, note:text.slice(0,80), ts:Date.now() };
  journal[todayStr] = { text, mood:selectedMood, ts:Date.now() };
  save();

  toast("&#x2713; Entry saved!");
  renderCalendar();
  renderHeader();
}
window.saveEntry = saveEntry;

/* ── HISTORY ENTRIES ── */
function renderEntries() {
  const journal = J(), moods = M(), month = data[today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")];
  const q = document.getElementById("searchInput")?.value.toLowerCase().trim() || "";
  const el = document.getElementById("pastEntries");

  let entries = Object.entries(journal).sort(([a],[b]) => b.localeCompare(a));
  if (q) entries = entries.filter(([,e]) => (e.text||"").toLowerCase().includes(q));

  if (!entries.length) {
    el.innerHTML = q
      ? `<div class="no-entries">No entries match "${q}"</div>`
      : `<div class="empty-state"><span class="empty-icon">&#x1F4D3;</span><div class="empty-title">No journal entries yet</div><div class="empty-sub">Write your first entry in the Today tab.</div></div>`;
    return;
  }

  el.innerHTML = "";
  entries.slice(0, 60).forEach(([dk, entry]) => {
    const md  = moods[dk];
    const mo  = md ? MOOD_MAP[md.val] : null;
    const d   = new Date(dk + "T12:00:00");
    const dayN = d.getDate();
    const isThisMonth = dk.slice(0,7) === (today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0"));

    let chips = "";
    if (isThisMonth && month?.tasks?.length) {
      const idx = dayN - 1;
      chips = month.tasks.slice(0, 5).map(t => {
        const s = t.days[idx]; if (s === "locked") return "";
        return `<span class="ehchip ${s==="done"?"done":s==="failed"?"fail":""}">${t.name.slice(0,16)}</span>`;
      }).filter(Boolean).join("");
    }

    const card = document.createElement("div");
    card.className = "entry-card";
    card.id = "entry-" + dk;
    card.innerHTML = `
      <div class="entry-header">
        <div class="entry-mood-emoji">${mo?.emoji || "&#x1F4DD;"}</div>
        <div class="entry-meta">
          <div class="entry-date-lbl">${fmtDisplay(dk)}${dk===todayStr?" <span style='color:var(--primary);font-size:0.65rem;'>TODAY</span>":""}</div>
          ${mo ? `<div class="entry-mood-lbl" style="color:${mo.color}">${mo.label}</div>` : ""}
          ${entry.text ? `<div class="entry-preview">${(_hs.escapeHTML||String)(entry.text.slice(0,60))}${entry.text.length>60?"...":""}</div>` : ""}
        </div>
        <div style="color:var(--muted);font-size:0.8rem;transform:rotate(0deg);transition:transform 0.2s" class="caret">&#8250;</div>
      </div>
      <div class="entry-body">
        ${chips ? `<div class="entry-habits">${chips}</div>` : ""}
        ${entry.text ? `<div class="entry-full-text">${(_hs.escapeHTML||String)(entry.text)}</div>` : "<em style='color:var(--muted);font-size:0.8rem'>No text written.</em>"}
        <div class="entry-actions">
          <button class="entry-action-btn" onclick="editEntry('${dk}',event)">&#x270F;&#xFE0F; Edit</button>
          <button class="entry-action-btn del" onclick="deleteEntry('${dk}',event)">&#x1F5D1; Delete</button>
        </div>
      </div>`;
    card.querySelector(".entry-header").onclick = () => {
      const wasExpanded = card.classList.contains("expanded");
      document.querySelectorAll(".entry-card.expanded").forEach(c => {
        c.classList.remove("expanded");
        c.querySelector(".caret").style.transform = "rotate(0deg)";
      });
      if (!wasExpanded) {
        card.classList.add("expanded");
        card.querySelector(".caret").style.transform = "rotate(90deg)";
      }
    };
    el.appendChild(card);
  });
}

function editEntry(dk, e) {
  e.stopPropagation();
  const entry = J()[dk];
  if (!dk || !entry) return;
  // Switch to today tab but populate with past entry data (today only)
  if (dk === todayStr) {
    showPanel("today", document.querySelectorAll(".tab")[0]);
    document.getElementById("journalText").value = entry.text || "";
    selectedMood = entry.mood || null;
    renderMoodPicker();
    document.getElementById("journalText").focus();
  } else {
    toast("You can only edit today's entry directly. Past entries are read-only.");
  }
}

function deleteEntry(dk, e) {
  e.stopPropagation();
  if (!confirm("Delete this entry? This can't be undone.")) return;
  delete J()[dk];
  delete M()[dk];
  save();
  renderCalendar();
  renderHeader();
  renderEntries();
  toast("Entry deleted.");
}
window.editEntry  = editEntry;
window.deleteEntry = deleteEntry;

/* ── INSIGHTS ── */
function renderInsights() {
  const moods = M(), journal = J();
  const allMoodEntries = Object.entries(moods).sort(([a],[b]) => a.localeCompare(b));
  const counts = {5:0,4:0,3:0,2:0,1:0};
  let total = 0, sum = 0;

  allMoodEntries.forEach(([,m]) => {
    if (m.val) { counts[m.val]++; total++; sum += m.val; }
  });

  const avg = total ? (sum / total).toFixed(1) : "—";
  const streak = (() => {
    let s = 0; const check = new Date(today);
    while (journal[fmt(check)]) { s++; check.setDate(check.getDate()-1); }
    return s;
  })();
  const totalEntries = Object.keys(journal).length;
  const dominantMood = total ? MOOD_MAP[Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]] : null;

  document.getElementById("insightsGrid").innerHTML = `
    <div class="ins-card"><div class="ins-val">${totalEntries}</div><div class="ins-lbl">Total entries</div></div>
    <div class="ins-card"><div class="ins-val">${streak}</div><div class="ins-lbl">Current streak</div><div class="ins-sub">days in a row</div></div>
    <div class="ins-card"><div class="ins-val">${avg}</div><div class="ins-lbl">Avg mood / 5</div><div class="ins-sub">${avg>=4?"&#x1F929; Great":avg>=3?"&#x1F60A; Good":avg>=2?"&#x1F610; Mixed":"&#x1F614; Tough"}</div></div>
    <div class="ins-card"><div class="ins-val">${dominantMood?.emoji||"—"}</div><div class="ins-lbl">Most common</div><div class="ins-sub">${dominantMood?.label||"No data"}</div></div>`;

  // 30-day mood graph
  const graphEl = document.getElementById("moodGraph");
  graphEl.innerHTML = "";
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate()-i);
    const k = fmt(d), md = moods[k];
    const bar = document.createElement("div");
    const pct = md ? (md.val / 5 * 100) : 0;
    const mo  = md ? MOOD_MAP[md.val] : null;
    bar.className = "sg-bar" + (md ? " filled" : "") + (i===0 ? " today" : "");
    bar.style.height = (pct || 4) + "%";
    if (mo) bar.style.background = mo.color;
    bar.title = d.toLocaleDateString("en-ZA",{day:"numeric",month:"short"}) + (md ? ` — ${mo?.label}` : " — no entry");
    graphEl.appendChild(bar);
  }

  // Mood breakdown bar
  const moodBarEl = document.getElementById("moodBar");
  const legendEl  = document.getElementById("moodLegend");
  moodBarEl.innerHTML = ""; legendEl.innerHTML = "";
  MOODS.forEach(m => {
    const pct = total ? (counts[m.val] / total * 100) : 0;
    if (pct > 0) {
      const seg = document.createElement("div");
      seg.className = "mood-seg";
      seg.style.flex = counts[m.val];
      seg.style.background = m.color;
      seg.title = m.label + " — " + counts[m.val] + " days";
      moodBarEl.appendChild(seg);
      legendEl.innerHTML += `<div class="mood-leg-item"><div class="mood-dot" style="background:${m.color}"></div>${m.emoji} ${m.label} (${counts[m.val]})</div>`;
    }
  });

  // Best/worst days
  const sorted = allMoodEntries.filter(([,m])=>m.val);
  const best  = [...sorted].sort(([,a],[,b])=>b.val-a.val).slice(0,2);
  const worst = [...sorted].sort(([,a],[,b])=>a.val-b.val).slice(0,2);
  const insEl = document.getElementById("insightEntries");
  insEl.innerHTML = "";

  [[best,"Best days &#x1F31F;"],[worst,"Tough days &#x1F4AA;"]].forEach(([group, label]) => {
    if (!group.length) return;
    insEl.innerHTML += `<div class="section-title" style="margin-top:12px;margin-bottom:6px">${label}</div>`;
    group.forEach(([dk, md]) => {
      const mo = MOOD_MAP[md.val];
      const entry = journal[dk];
      const div = document.createElement("div");
      div.className = "entry-card";
      div.style.cursor = "default";
      div.innerHTML = `<div class="entry-header">
        <div class="entry-mood-emoji">${mo?.emoji||""}</div>
        <div class="entry-meta">
          <div class="entry-date-lbl">${fmtDisplay(dk)}</div>
          ${mo ? `<div class="entry-mood-lbl" style="color:${mo.color}">${mo.label}</div>` : ""}
          ${entry?.text ? `<div class="entry-preview">${(_hs.escapeHTML||String)(entry.text.slice(0,80))}${entry.text.length>80?"...":""}</div>` : ""}
        </div>
      </div>`;
      insEl.appendChild(div);
    });
  });
}

/* ── TOAST ── */
let _tt = null;
function toast(msg) {
  const el = document.getElementById("jToast");
  el.innerHTML = msg; el.classList.add("show");
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove("show"), 2800);
}

/* ── INIT ── */
renderHeader();
renderCalendar();
renderMoodPicker();
renderPrompts();

// Page transitions
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || href.startsWith("http") || href.startsWith("#") || href.startsWith("javascript")) return;
  if (a.target === "_blank") return;
  e.preventDefault();
  document.body.style.transition = "opacity 0.18s ease";
  document.body.style.opacity = "0";
  setTimeout(() => { window.location.href = href; }, 180);
});
</script>

<script>
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  if (window._pageReady) window._pageReady();

/* ─── AI JOURNAL REFLECTION (Claude API) ─────────── */
async function generateAIReflection() {
  if (window.HabitPremium && !window.HabitPremium.isPremium()) {
    window.HabitPremium.showUpgradeWall("journalAI");
    return;
  }

  const box = document.getElementById("aiReflectionBox");
  const moods = M(), j = J();

  // Build last 7 days of data
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const k = fmt(d);
    const mood = moods[k];
    const entry = j[k];
    days.push({
      date: d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }),
      mood: mood ? MOOD_MAP[mood.val]?.label : null,
      moodVal: mood?.val || null,
      note: mood?.note || null,
      journalText: entry?.text || null
    });
  }

  const hasSomeData = days.some(d => d.mood || d.journalText);
  if (!hasSomeData) {
    box.innerHTML = "<span style='color:var(--muted);font-size:0.82rem'>Write a few journal entries first — your reflection will appear here.</span>";
    return;
  }

  box.innerHTML = `<div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:0.82rem">
    <div style="width:16px;height:16px;border:2px solid rgba(16,185,129,0.3);border-top-color:#10b981;
      border-radius:50%;animation:jSpin 0.7s linear infinite"></div>
    Generating your reflection…
  </div>`;

  const contextLines = days.map(d => {
    const parts = [d.date];
    if (d.mood) parts.push(`Mood: ${d.mood}${d.moodVal ? " ("+d.moodVal+"/5)" : ""}`);
    if (d.note) parts.push(`Note: "${d.note}"`);
    if (d.journalText) parts.push(`Journal: "${d.journalText.slice(0, 150)}${d.journalText.length > 150 ? "…" : ""}"`);
    return parts.join(" | ");
  }).join("\n");

  const userName = au?.displayName || au?.username || "the user";

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 300,
        messages: [{
          role: "user",
          content: `You are a warm, insightful journal coach. Based on ${userName}'s last 7 days of mood and journal data, write a short, personal weekly reflection (3–4 sentences max). Be specific to what they wrote — notice patterns, celebrate wins, acknowledge tough days gently. End with one kind, actionable encouragement for the week ahead. Don't be generic. Don't list things. Write in flowing prose, second person ("You").\n\nData:\n${contextLines}`
        }]
      })
    });

    if (!res.ok) throw new Error("API " + res.status);
    const data = await res.json();
    const text = data.content?.[0]?.text || "Couldn't generate a reflection right now.";

    box.innerHTML = `
      <div>
        <div style="font-size:0.82rem;line-height:1.7;color:var(--text)">${text.replace(/\n/g,"<br>")}</div>
        <div style="margin-top:12px;display:flex;justify-content:flex-end">
          <button onclick="generateAIReflection()" style="font-size:0.68rem;padding:5px 12px;
            background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#10b981;
            border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700">↻ Refresh</button>
        </div>
      </div>`;

  } catch(e) {
    box.innerHTML = "<span style='color:var(--muted);font-size:0.82rem'>Couldn't connect right now. Check your connection and try again.</span>";
  }
}
window.generateAIReflection = generateAIReflection;

</script>
