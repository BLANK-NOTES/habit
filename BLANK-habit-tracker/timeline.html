<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly View · Habit Tracker</title>
<script>
  (function(){ var t=localStorage.getItem('habitTheme')||'dark'; document.documentElement.setAttribute('data-theme',t); document.addEventListener('DOMContentLoaded',function(){document.body.setAttribute('data-theme',t);}); })();
</script>
<script src="habitSecurity.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--panel:#111118;--card:#161622;--border:rgba(255,255,255,0.07);--text:#eeeef5;--muted:#6b7280;--primary:#4CAF50;--done:#4ade80;--missed:#f87171;--warn:#fbbf24;}
[data-theme="light"]{--bg:#f2f4f0;--panel:#fff;--card:#e8ede9;--border:rgba(0,0,0,0.08);--text:#111827;--muted:#6b7280;--primary:#16a34a;}
[data-theme="pink"]{--bg:#1a0814;--panel:#220d1a;--card:#2c1020;--text:#fce7f3;--muted:#c084a8;--primary:#f472b6;--border:rgba(244,114,182,0.12);}
[data-theme="blue"]{--bg:#060d1a;--panel:#0c1628;--card:#101e34;--text:#dbeafe;--muted:#6b96cc;--primary:#60a5fa;--border:rgba(96,165,250,0.1);}
[data-theme="yellow"]{--bg:#0f0d00;--panel:#1a1600;--card:#221e00;--text:#fef9c3;--muted:#a89020;--primary:#fbbf24;--border:rgba(251,191,36,0.12);}
[data-theme="army"]{--bg:#080f08;--panel:#0f1a0f;--card:#152015;--text:#d9f0d9;--muted:#6b8a5a;--primary:#84cc16;--border:rgba(132,204,22,0.1);}
[data-theme="ferrari"]{--bg:#0f0202;--panel:#1a0404;--card:#220606;--text:#fee2e2;--muted:#996060;--primary:#ef4444;--border:rgba(239,68,68,0.12);}
[data-theme="midnight"]{--bg:#030308;--panel:#080812;--card:#0d0d1c;--text:#ede9fe;--muted:#7c6ba0;--primary:#a78bfa;--border:rgba(167,139,250,0.1);}
[data-theme="ocean"]{--bg:#020c14;--panel:#051422;--card:#081c30;--text:#cffafe;--muted:#4d8fa0;--primary:#06b6d4;--border:rgba(6,182,212,0.1);}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:40px;}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body{animation:pageIn 0.28s cubic-bezier(0.34,1.05,0.64,1) both;}

/* HEADER */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10;}
.back{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:7px 14px;font-size:0.8rem;font-weight:700;text-decoration:none;transition:all 0.2s;}
.back:hover{color:var(--text);border-color:var(--primary);}
.htitle{font-size:1rem;font-weight:900;flex:1;}
.week-nav{display:flex;align-items:center;gap:8px;}
.wnav-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:0.8rem;cursor:pointer;transition:all 0.2s;font-family:inherit;}
.wnav-btn:hover{border-color:var(--primary);color:var(--text);}
.week-label{font-size:0.75rem;font-weight:800;color:var(--muted);min-width:90px;text-align:center;}

/* WEEK SUMMARY PILLS */
.week-summary{display:flex;gap:10px;padding:14px 16px;overflow-x:auto;border-bottom:1px solid var(--border);}
.sum-pill{flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 16px;text-align:center;min-width:80px;}
.sum-val{font-size:1.2rem;font-weight:900;color:var(--primary);}
.sum-lbl{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}

/* DAY COLUMNS */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-bottom:1px solid var(--border);}
.day-col-hdr{padding:10px 4px 8px;text-align:center;border-right:1px solid var(--border);background:var(--panel);}
.day-col-hdr:last-child{border-right:none;}
.day-name{font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);}
.day-num{font-size:1rem;font-weight:900;margin-top:2px;}
.day-num.today{color:var(--primary);}
.day-dot{width:6px;height:6px;border-radius:50%;margin:4px auto 0;background:transparent;}
.day-dot.has-data{background:var(--primary);}
.day-pct{font-size:0.6rem;font-weight:700;color:var(--muted);margin-top:3px;}

/* HABIT ROWS */
.habit-rows{max-width:100%;overflow-x:auto;}
.habit-row{display:grid;grid-template-columns:140px repeat(7,1fr);border-bottom:1px solid var(--border);transition:background 0.15s;}
.habit-row:hover{background:color-mix(in srgb,var(--primary) 3%,transparent);}
.habit-row:last-child{border-bottom:none;}
.habit-name-cell{display:flex;align-items:center;gap:8px;padding:10px 12px;border-right:1px solid var(--border);font-size:0.8rem;font-weight:700;min-height:48px;word-break:break-word;}
.habit-cat-icon{font-size:1rem;flex-shrink:0;}
.habit-day-cell{display:flex;align-items:center;justify-content:center;padding:8px 4px;border-right:1px solid var(--border);min-height:48px;cursor:default;}
.habit-day-cell:last-child{border-right:none;}
.hdc-pip{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;transition:all 0.15s;}
.hdc-pip.done{background:color-mix(in srgb,var(--done) 18%,transparent);border:1.5px solid color-mix(in srgb,var(--done) 50%,transparent);}
.hdc-pip.missed{background:color-mix(in srgb,var(--missed) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--missed) 35%,transparent);}
.hdc-pip.locked{opacity:0.2;}
.hdc-pip.unmarked-today{background:color-mix(in srgb,var(--primary) 10%,transparent);border:1.5px dashed var(--primary);animation:pip-pulse 2s ease-in-out infinite;}
.hdc-pip.unmarked-past{background:color-mix(in srgb,var(--missed) 8%,transparent);border:1.5px solid var(--border);}
.hdc-pip.future{border:1.5px dashed var(--border);opacity:0.3;}
@keyframes pip-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 40%,transparent)}50%{box-shadow:0 0 0 4px transparent}}

/* TIMELINE view (today only) */
.section-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);}
.section-hdr::after{content:"";flex:1;height:1px;background:var(--border);}

.timeline{padding:0 16px 16px;max-width:560px;margin:0 auto;}
.tl-item{display:flex;align-items:center;gap:12px;margin-bottom:8px;animation:itemIn 0.3s ease both;}
@keyframes itemIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.tl-time{width:42px;font-size:0.68rem;font-weight:800;color:var(--muted);text-align:right;flex-shrink:0;}
.tl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid var(--border);}
.tl-dot.done{background:var(--done);border-color:var(--done);box-shadow:0 0 6px color-mix(in srgb,var(--done) 50%,transparent);}
.tl-dot.upcoming{background:var(--card);border-color:var(--primary);animation:dotPulse 2s ease-in-out infinite;}
.tl-dot.missed{background:var(--missed);border-color:var(--missed);}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 40%,transparent)}50%{box-shadow:0 0 0 4px transparent}}
.tl-card{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 13px;display:flex;align-items:center;gap:10px;transition:all 0.2s;}
.tl-card.done{border-color:color-mix(in srgb,var(--done) 30%,transparent);background:color-mix(in srgb,var(--done) 5%,var(--panel));}
.tl-card.missed{border-color:color-mix(in srgb,var(--missed) 25%,transparent);}
.tl-card.upcoming{border-color:color-mix(in srgb,var(--primary) 30%,transparent);}
.tl-cat{font-size:1rem;flex-shrink:0;}
.tl-name{flex:1;font-size:0.84rem;font-weight:700;}
.tl-status{font-size:0.72rem;font-weight:700;flex-shrink:0;}
.tl-card.done .tl-status{color:var(--done);}
.tl-card.missed .tl-status{color:var(--missed);}
.tl-card.upcoming .tl-status{color:var(--primary);}
.now-line{display:flex;align-items:center;gap:10px;margin:4px 0 10px;}
.now-dot{width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px color-mix(in srgb,var(--primary) 60%,transparent);flex-shrink:0;animation:nowPulse 1.5s ease-in-out infinite;}
@keyframes nowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.now-txt{font-size:0.72rem;font-weight:800;color:var(--primary);}

/* FLEXIBLE chips */
.flex-grid{display:flex;flex-wrap:wrap;gap:7px;padding:4px 16px 16px;}
.flex-chip{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:0.78rem;font-weight:700;display:flex;align-items:center;gap:6px;}
.flex-chip.done{border-color:color-mix(in srgb,var(--done) 40%,transparent);color:var(--done);}
.flex-chip.missed{border-color:color-mix(in srgb,var(--missed) 35%,transparent);color:var(--missed);}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:3rem;margin-bottom:12px;}
.empty-title{font-size:1rem;font-weight:800;margin-bottom:6px;color:var(--text);}
.empty-sub{font-size:0.82rem;line-height:1.5;}

/* VIEW TABS */
.view-tabs{display:flex;gap:0;padding:12px 16px;border-bottom:1px solid var(--border);}
.vt-btn{flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.vt-btn:first-child{border-radius:10px 0 0 10px;}
.vt-btn:last-child{border-radius:0 10px 10px 0;}
.vt-btn.active{background:color-mix(in srgb,var(--primary) 15%,transparent);border-color:var(--primary);color:var(--primary);}
</style>
</head>
<body>
<header class="hdr">
  <a href="monthly.html" class="back">← Home</a>
  <div class="htitle">📅 Weekly</div>
  <div class="week-nav">
    <button class="wnav-btn" id="prevWeek">&#8249;</button>
    <div class="week-label" id="weekLabel">This week</div>
    <button class="wnav-btn" id="nextWeek">&#8250;</button>
  </div>
</header>

<!-- VIEW TABS -->
<div class="view-tabs">
  <button class="vt-btn active" id="tabWeekly" onclick="showView('weekly')">📆 Week Grid</button>
  <button class="vt-btn" id="tabToday" onclick="showView('today')">⏰ Today's Schedule</button>
</div>

<!-- SUMMARY PILLS -->
<div class="week-summary" id="weekSummary"></div>

<!-- WEEKLY GRID VIEW -->
<div id="viewWeekly">
  <div class="week-grid" id="weekDayHeaders"></div>
  <div class="habit-rows" id="habitRows">
    <div class="empty"><div class="empty-icon">📅</div><div class="empty-title">No habits yet</div><div class="empty-sub">Add habits from the dashboard to see your weekly grid here.</div></div>
  </div>
</div>

<!-- TODAY SCHEDULE VIEW -->
<div id="viewToday" style="display:none">
  <div id="todaySchedule"></div>
</div>

<script>
const _hs = window.HabitSecurity || {};
const esc = _hs.escapeHTML || (s => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])));

const au = JSON.parse(localStorage.getItem("auth_user") || "null");
if (!au) location.href = "auth.html";
document.body.setAttribute("data-theme", localStorage.getItem("habitTheme") || "dark");

const CAT_ICONS = {fitness:"💪",health:"❤️",mindful:"🧘",learning:"📚",productive:"🚀",nutrition:"🥗",social:"💬",balance:"⚖️",general:"🌀"};
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let weekOffset = 0; // 0 = current week, -1 = last week, etc.
let currentView = "weekly";

// Get the Monday of the week at offset
const getWeekDates = (offset) => {
  const now = new Date();
  const dow = now.getDay(); // 0=Sun
  const monday = new Date(now);
  monday.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
  monday.setHours(0,0,0,0);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
};

const mkKey = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const dateKey = (d) => mkKey(d) + "-" + String(d.getDate()).padStart(2,"0");
const raw = JSON.parse(localStorage.getItem("habitTracker_" + au.id) || "{}");

const getMonthData = (d) => raw[mkKey(d)] || {tasks:[]};
const getDayState  = (task, d) => task.days[d.getDate()-1];

const isToday = (d) => {
  const now = new Date();
  return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
};
const isFuture = (d) => d > new Date();

function render() {
  const dates = getWeekDates(weekOffset);
  const today  = new Date();

  // Week label
  const from = dates[0], to = dates[6];
  const sameMonth = from.getMonth() === to.getMonth();
  document.getElementById("weekLabel").textContent = sameMonth
    ? MONTHS[from.getMonth()] + " " + from.getDate() + "–" + to.getDate()
    : MONTHS[from.getMonth()] + " " + from.getDate() + " – " + MONTHS[to.getMonth()] + " " + to.getDate();

  // Disable next week button if this is current week
  document.getElementById("nextWeek").disabled = weekOffset >= 0;
  document.getElementById("nextWeek").style.opacity = weekOffset >= 0 ? "0.3" : "1";

  // Collect all unique habits active this week
  const allHabits = new Map();
  dates.forEach(d => {
    const mo = getMonthData(d);
    mo.tasks.forEach(t => {
      if (!allHabits.has(t.id)) allHabits.set(t.id, {task: t, monthKey: mkKey(d)});
    });
  });

  // Day headers
  const hdrEl = document.getElementById("weekDayHeaders");
  hdrEl.innerHTML = dates.map(d => {
    const pct = getDayPct(d, allHabits);
    return `<div class="day-col-hdr">
      <div class="day-name">${DAY_SHORT[d.getDay()]}</div>
      <div class="day-num${isToday(d) ? " today" : ""}">${d.getDate()}</div>
      <div class="day-dot${pct !== null ? " has-data" : ""}"></div>
      ${pct !== null ? `<div class="day-pct">${pct}%</div>` : ""}
    </div>`;
  }).join("");

  // Summary pills
  let totalDone = 0, totalActive = 0, perfectDays = 0, streakCount = 0;
  dates.forEach(d => {
    if (isFuture(d)) return;
    const {done, active} = getDayCounts(d, allHabits);
    totalDone += done; totalActive += active;
    if (active > 0 && done === active) perfectDays++;
  });
  // Count current streak from this week
  for (let i = 6; i >= 0; i--) {
    const d = dates[i];
    if (isFuture(d)) continue;
    const {done, active} = getDayCounts(d, allHabits);
    if (active > 0 && done / active >= 0.8) streakCount++;
    else break;
  }
  const pct = totalActive ? Math.round(totalDone / totalActive * 100) : 0;
  document.getElementById("weekSummary").innerHTML = `
    <div class="sum-pill"><div class="sum-val">${pct}%</div><div class="sum-lbl">Week avg</div></div>
    <div class="sum-pill"><div class="sum-val">${totalDone}/${totalActive}</div><div class="sum-lbl">Habits done</div></div>
    <div class="sum-pill"><div class="sum-val">${perfectDays}/7</div><div class="sum-lbl">Perfect days</div></div>
    <div class="sum-pill"><div class="sum-val">${allHabits.size}</div><div class="sum-lbl">Total habits</div></div>
  `;

  // Habit rows
  const rowsEl = document.getElementById("habitRows");
  if (!allHabits.size) {
    rowsEl.innerHTML = `<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">No habits this week</div><div class="empty-sub">Add habits from the dashboard to see your weekly grid here.</div></div>`;
    return;
  }

  rowsEl.innerHTML = "";
  allHabits.forEach(({task}) => {
    const row = document.createElement("div");
    row.className = "habit-row";

    const nameCell = document.createElement("div");
    nameCell.className = "habit-name-cell";
    nameCell.innerHTML = `<span class="habit-cat-icon">${CAT_ICONS[task.category||"general"]||"🌀"}</span><span>${esc(task.name||"")}</span>`;
    row.appendChild(nameCell);

    dates.forEach(d => {
      const cell = document.createElement("div");
      cell.className = "habit-day-cell";

      const mo = getMonthData(d);
      const t  = mo.tasks.find(x => x.id === task.id || x.name === task.name);
      const pip = document.createElement("div");
      pip.className = "hdc-pip";

      if (!t) {
        pip.className += " locked";
        pip.textContent = "";
      } else {
        const state = t.days[d.getDate()-1];
        if (state === "locked") { pip.className += " locked"; pip.textContent = "—"; }
        else if (state === "done") { pip.className += " done"; pip.textContent = "✓"; }
        else if (state === "failed" || state === "missed") { pip.className += " missed"; pip.textContent = "✗"; }
        else if (isFuture(d)) { pip.className += " future"; pip.textContent = "·"; }
        else if (isToday(d)) { pip.className += " unmarked-today"; pip.textContent = "○"; }
        else { pip.className += " unmarked-past"; pip.textContent = "○"; }
      }
      cell.appendChild(pip);
      row.appendChild(cell);
    });

    rowsEl.appendChild(row);
  });

  // Render today schedule
  renderTodaySchedule(dates);
}

function getDayCounts(d, allHabits) {
  const mo = getMonthData(d);
  let done = 0, active = 0;
  mo.tasks.forEach(t => {
    const state = t.days[d.getDate()-1];
    if (state !== "locked") { active++; if (state === "done") done++; }
  });
  return {done, active};
}

function getDayPct(d, allHabits) {
  if (isFuture(d)) return null;
  const {done, active} = getDayCounts(d, allHabits);
  if (!active) return null;
  return Math.round(done / active * 100);
}

function renderTodaySchedule(dates) {
  const today = dates.find(d => isToday(d)) || dates[0];
  const mo = getMonthData(today);
  const todayIdx = today.getDate() - 1;
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();

  const habits = mo.tasks
    .filter(t => t.days[todayIdx] !== "locked")
    .map(t => ({
      name: t.name, cat: t.category||"general",
      time: t.scheduledTime||null,
      state: t.days[todayIdx]||"unmarked",
    }));

  const timed   = habits.filter(h => h.time).sort((a,b) => a.time.localeCompare(b.time));
  const untimed = habits.filter(h => !h.time);

  const fmtTime = t => {
    const [h,m] = t.split(":").map(Number);
    return (h%12||12) + (m?":"+String(m).padStart(2,"0"):"") + (h>=12?"pm":"am");
  };

  const el = document.getElementById("todaySchedule");
  let html = "";

  if (!habits.length) {
    html = `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">No habits today</div><div class="empty-sub">Set a schedule for your habits on the dashboard, and assign times to see them here.</div></div>`;
    el.innerHTML = html;
    return;
  }

  if (timed.length) {
    html += `<div class="section-hdr">Today's Schedule</div><div class="timeline">`;
    let nowInserted = false;
    timed.forEach((h, i) => {
      const [hh,mm] = h.time.split(":").map(Number);
      const hMins = hh*60+mm;
      const status = h.state==="done" ? "done" : h.state==="failed" ? "missed" : hMins > nowMins ? "upcoming" : "unmarked";
      if (!nowInserted && hMins > nowMins) {
        nowInserted = true;
        html += `<div class="now-line"><div class="now-dot"></div><div class="now-txt">NOW — ${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}</div></div>`;
      }
      const statusLabel = {done:"✓ Done", missed:"✗ Missed", upcoming:"▶ Up next", unmarked:"○ Pending"};
      html += `<div class="tl-item" style="animation-delay:${i*0.04}s">
        <div class="tl-time">${fmtTime(h.time)}</div>
        <div class="tl-dot ${status}"></div>
        <div class="tl-card ${status}">
          <div class="tl-cat">${CAT_ICONS[h.cat]||"🌀"}</div>
          <div class="tl-name">${esc(h.name)}</div>
          <div class="tl-status">${statusLabel[status]||""}</div>
        </div></div>`;
    });
    if (!nowInserted) html += `<div class="now-line"><div class="now-dot"></div><div class="now-txt">NOW — ${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}</div></div>`;
    html += `</div>`;
  }

  if (untimed.length) {
    html += `<div class="section-hdr">Flexible (any time)</div><div class="flex-grid">`;
    untimed.forEach(h => {
      const cls = h.state==="done"?"done":h.state==="failed"?"missed":"";
      html += `<div class="flex-chip ${cls}">${CAT_ICONS[h.cat]||"🌀"} ${esc(h.name)} ${h.state==="done"?"✓":h.state==="failed"?"✗":""}</div>`;
    });
    html += `</div>`;
  }

  el.innerHTML = html;
}

function showView(v) {
  currentView = v;
  document.getElementById("viewWeekly").style.display = v === "weekly" ? "" : "none";
  document.getElementById("viewToday").style.display  = v === "today"  ? "" : "none";
  document.getElementById("tabWeekly").classList.toggle("active", v === "weekly");
  document.getElementById("tabToday").classList.toggle("active",  v === "today");
}

document.getElementById("prevWeek").onclick = () => { weekOffset--; render(); };
document.getElementById("nextWeek").onclick = () => { if (weekOffset < 0) { weekOffset++; render(); } };

render();

// Page transitions
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || href.startsWith("http") || href.startsWith("#")) return;
  if (a.target === "_blank") return;
  e.preventDefault();
  document.body.style.animation = "none";
  document.body.style.opacity   = "0";
  document.body.style.transition = "opacity 0.18s ease";
  setTimeout(() => { window.location.href = href; }, 180);
});
</script>

    });

</script>
