<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--panel:#111118;--card:#161622;--border:rgba(255,255,255,0.07);--text:#eeeef5;--muted:#6b7280;--primary:#4CAF50;}
[data-theme="light"]{--bg:#f5f6fa;--panel:#fff;--card:#f0f1f8;--border:rgba(0,0,0,0.08);--text:#111827;--muted:#6b7280;--primary:#16a34a;}
[data-theme="pink"]{--bg:#1a0814;--panel:#220d1a;--card:#2c1020;--text:#fce7f3;--muted:#c084a8;--primary:#f472b6;--border:rgba(244,114,182,0.12);}
[data-theme="blue"]{--bg:#060d1a;--panel:#0c1628;--card:#101e34;--text:#dbeafe;--muted:#6b96cc;--primary:#60a5fa;--border:rgba(96,165,250,0.1);}
[data-theme="yellow"]{--bg:#0f0d00;--panel:#1a1600;--card:#221e00;--text:#fef9c3;--muted:#a89020;--primary:#fbbf24;--border:rgba(251,191,36,0.12);}
[data-theme="midnight"]{--bg:#030308;--panel:#080812;--card:#0d0d1c;--text:#ede9fe;--muted:#7c6ba0;--primary:#a78bfa;--border:rgba(167,139,250,0.1);}
[data-theme="ocean"]{--bg:#020c14;--panel:#051422;--card:#081c30;--text:#cffafe;--muted:#4d8fa0;--primary:#06b6d4;--border:rgba(6,182,212,0.1);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:32px;}
.header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10;}
.back{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:0.78rem;font-weight:700;text-decoration:none;}
.back:hover{color:var(--text);border-color:var(--primary);}
.htitle{font-size:0.95rem;font-weight:900;flex:1;}
.share-btn{background:var(--primary);border:none;color:#fff;border-radius:10px;padding:7px 14px;font-size:0.78rem;font-weight:800;cursor:pointer;font-family:inherit;}
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--primary) 15%,var(--bg)),var(--bg));padding:28px 20px 20px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,color-mix(in srgb,var(--primary) 20%,transparent),transparent);}
.avatar-wrap{position:relative;display:inline-block;margin-bottom:14px;}
.avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 50%,#000));display:flex;align-items:center;justify-content:center;font-size:2.8rem;border:3px solid color-mix(in srgb,var(--primary) 50%,transparent);position:relative;z-index:1;}
.level-badge{position:absolute;bottom:-4px;right:-4px;background:var(--primary);color:#fff;font-size:0.65rem;font-weight:900;border-radius:10px;padding:2px 7px;border:2px solid var(--bg);z-index:2;}
.display-name{font-size:1.4rem;font-weight:900;margin-bottom:3px;}
.username{font-size:0.82rem;color:var(--muted);margin-bottom:14px;}
.hero-stats{display:flex;gap:20px;justify-content:center;margin-top:4px;}
.hstat{text-align:center;}
.hstat-val{font-size:1.2rem;font-weight:900;color:var(--primary);}
.hstat-lbl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:1px;}
.section{padding:16px;}
.section-title{font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:12px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.stat-val{font-size:1.4rem;font-weight:900;color:var(--primary);}
.stat-lbl{font-size:0.68rem;color:var(--muted);margin-top:3px;}
.badge-grid{display:flex;flex-wrap:wrap;gap:8px;}
.badge{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:0.78rem;font-weight:700;display:flex;align-items:center;gap:6px;}
.badge.earned{border-color:color-mix(in srgb,var(--primary) 40%,transparent);color:var(--primary);}
.habits-list{display:flex;flex-direction:column;gap:8px;}
.habit-row{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;}
.habit-name{flex:1;font-size:0.85rem;font-weight:700;}
.habit-pct{font-size:0.8rem;font-weight:900;color:var(--primary);}
.habit-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:4px;width:100%;}
.habit-fill{height:100%;border-radius:3px;background:var(--primary);}
.share-section{margin:16px;background:var(--panel);border:1px dashed var(--border);border-radius:16px;padding:16px;text-align:center;}
.share-url{font-size:0.75rem;color:var(--muted);word-break:break-all;margin:8px 0;}
.copy-btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 16px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.copy-btn:hover{border-color:var(--primary);color:var(--primary);}
</style>
<script src="habitSecurity.js"></script>
</head>
<body>
<header class="header">
  <a href="monthly.html" class="back">&#8592; Home</a>
  <div class="htitle">My Profile</div>
  <button class="share-btn" onclick="shareProfile()">&#128279; Share</button>
</header>

<div id="root"></div>

<script>
  const _hs = window.HabitSecurity || {};

const au=JSON.parse(localStorage.getItem("auth_user")||"null");
if(!au) location.href="auth.html";
document.body.setAttribute("data-theme",localStorage.getItem("habitTheme")||"dark");

const raw=JSON.parse(localStorage.getItem("habitTracker_"+au.id)||"{}");
const today=new Date();
const xp=raw.xp||{level:1,lifetimeXP:0};
const gems=raw.gems?.total||0;
const ls=raw.loginStreak?.count||0;

// Gather current month habits
const mk=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
const mo=raw[mk]||{tasks:[]};
const habits=mo.tasks.map(t=>{
  const a=t.days.filter(s=>s!=="locked").length;
  const d=t.days.filter(s=>s==="done").length;
  return{name:t.name,pct:a?Math.round(d/a*100):0,cat:t.category||"general"};
}).sort((a,b)=>b.pct-a.pct);

// Count total done across all months
let totalDone=0,perfectDays=0;
Object.keys(raw).filter(k=>/^\d{4}-\d{2}$/.test(k)).forEach(mk=>{
  const m=raw[mk];
  if(!m?.tasks?.length)return;
  const days=m.tasks[0].days.length;
  m.tasks.forEach(t=>{totalDone+=t.days.filter(s=>s==="done").length;});
  for(let d=0;d<days;d++){
    const active=m.tasks.filter(t=>t.days[d]!=="locked");
    if(active.length&&active.every(t=>t.days[d]==="done"))perfectDays++;
  }
});

// Earned badges (simplified)
const badges=[
  {icon:"&#x1F525;",name:"On Fire",earned:ls>=7},
  {icon:"&#x1F3C6;",name:"Century",earned:totalDone>=100},
  {icon:"&#x2B50;",name:"Perfectionist",earned:perfectDays>=10},
  {icon:"&#x26A1;",name:"Level 10+",earned:xp.level>=10},
  {icon:"&#x1F48E;",name:"Gem Hoarder",earned:gems>=100},
  {icon:"&#x1F4AA;",name:"Consistent",earned:ls>=30},
  {icon:"&#x1F9D8;",name:"Mindful",earned:habits.some(h=>h.cat==="mindful"&&h.pct>=80)},
  {icon:"&#x1F3CB;",name:"Fitness Fan",earned:habits.some(h=>h.cat==="fitness"&&h.pct>=80)},
];
const earned=badges.filter(b=>b.earned);

const avatarEmoji=au.profile?.avatar||"&#x1F60A;";
const grade=xp.level>=20?"Legend":xp.level>=10?"Pro":xp.level>=5?"Rising":"Starter";

document.getElementById("root").innerHTML=`
<div class="hero">
  <div class="avatar-wrap">
    <div class="avatar">${avatarEmoji}</div>
    <div class="level-badge">LV ${xp.level}</div>
  </div>
  <div class="display-name">${(_hs.escapeHTML||String)(au.displayName||au.username||"")}</div>
  <div class="username">@${(_hs.escapeHTML||String)(au.username||"")} &middot; ${grade}</div>
  <div class="hero-stats">
    <div class="hstat"><div class="hstat-val">${ls}</div><div class="hstat-lbl">&#x1F525; Streak</div></div>
    <div class="hstat"><div class="hstat-val">${(xp.lifetimeXP||0).toLocaleString()}</div><div class="hstat-lbl">&#x26A1; XP</div></div>
    <div class="hstat"><div class="hstat-val">${perfectDays}</div><div class="hstat-lbl">&#x2B50; Perfect</div></div>
    <div class="hstat"><div class="hstat-val">${gems}</div><div class="hstat-lbl">&#x1F48E; Gems</div></div>
  </div>
</div>

<div class="section">
  <div class="section-title">Stats</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val">${totalDone.toLocaleString()}</div><div class="stat-lbl">Total habits done</div></div>
    <div class="stat-card"><div class="stat-val">${xp.level}</div><div class="stat-lbl">Current level</div></div>
    <div class="stat-card"><div class="stat-val">${perfectDays}</div><div class="stat-lbl">Perfect days</div></div>
    <div class="stat-card"><div class="stat-val">${habits.length}</div><div class="stat-lbl">Active habits</div></div>
  </div>
</div>

${earned.length?`<div class="section">
  <div class="section-title">Badges (${earned.length})</div>
  <div class="badge-grid">${earned.map(b=>`<div class="badge earned">${b.icon} ${(_hs.escapeHTML||String)(b.name||"")}</div>`).join("")}</div>
</div>`:""}

${habits.length?`<div class="section">
  <div class="section-title">This Month</div>
  <div class="habits-list">${habits.slice(0,6).map(h=>`
    <div class="habit-row">
      <div style="flex:1">
        <div class="habit-name">${(_hs.escapeHTML||String)(h.name||"")}</div>
        <div class="habit-bar"><div class="habit-fill" style="width:${h.pct}%"></div></div>
      </div>
      <div class="habit-pct">${h.pct}%</div>
    </div>`).join("")}
  </div>
</div>`:""}

<div class="share-section">
  <div style="font-size:0.85rem;font-weight:800;margin-bottom:6px">&#x1F4F1; Share your profile</div>
  <div class="share-url" id="profileUrl">Copy link to share your stats</div>
  <button class="copy-btn" onclick="shareProfile()">&#x1F4CB; Copy share link</button>
</div>`;

const shareProfile=()=>{
  const data=encodeURIComponent(JSON.stringify({
    name:au.displayName||au.username,
    username:au.username,
    level:xp.level,
    xp:xp.lifetimeXP||0,
    streak:ls,
    perfectDays,
    totalDone,
    avatar:au.profile?.avatar||"&#x1F60A;",
  }));
  // In a real app this would be a server URL. For local, we use a data approach.
  const text=`&#x1F3C6; ${(_hs.escapeHTML||String)(au.displayName||au.username||"")}'s Habit Tracker Stats\n&#x26A1; Level ${xp.level} | ${(xp.lifetimeXP||0).toLocaleString()} XP\n&#x1F525; ${ls}-day streak | &#x2B50; ${perfectDays} perfect days\n&#x2705; ${totalDone} total habits completed`;
  if(navigator.share){navigator.share({title:"My Habit Stats",text:text});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert("Stats copied to clipboard! Paste and share."));}
  else{prompt("Copy this:",text);}
};
window.shareProfile=shareProfile;
</script>
<script>
// Smart back: if opened from settings, back goes to settings
(function() {
  if (sessionStorage.getItem('settingsReturn') === '1') {
    sessionStorage.removeItem('settingsReturn');
    var backs = document.querySelectorAll('a[href="monthly.html"].back, a[href="monthly.html"].back-btn, .back-btn, .back');
    backs.forEach(function(b) {
      if (b.getAttribute('href') === 'monthly.html') {
        b.href = 'settings.html';
        b.textContent = '← Settings';
      }
    });
  }
})();
</script>
</body>
</html>
