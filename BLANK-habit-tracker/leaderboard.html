<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard · Habit Tracker</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0c0c14;--panel:#121220;--card:#1a1a2e;--border:rgba(255,255,255,0.08);--text:#f0f0f8;--muted:#6b7280;--primary:#4CAF50;--primary-dim:rgba(76,175,80,0.12);}
  [data-theme="light"]  {--bg:#f4f4f8;--panel:#fff;--card:#f0f0f6;--border:rgba(0,0,0,0.1);--text:#111;--muted:#666;}
  [data-theme="pink"]   {--bg:#1a0a14;--panel:#200d18;--card:#2a1020;--border:rgba(255,100,150,0.15);--primary:#f472b6;--primary-dim:rgba(244,114,182,0.12);}
  [data-theme="blue"]   {--bg:#0a1020;--panel:#0d1628;--card:#101e34;--border:rgba(100,160,255,0.12);--primary:#60a5fa;--primary-dim:rgba(96,165,250,0.12);}
  [data-theme="yellow"] {--bg:#14120a;--panel:#1c1908;--card:#26230e;--border:rgba(250,200,20,0.12);--primary:#fbbf24;--primary-dim:rgba(251,191,36,0.12);}
  [data-theme="army"]   {--bg:#0e100a;--panel:#141810;--card:#1c2214;--border:rgba(120,160,80,0.12);--primary:#84cc16;--primary-dim:rgba(132,204,22,0.12);}
  [data-theme="ferrari"]{--bg:#120808;--panel:#1a0c0c;--card:#221010;--border:rgba(255,60,60,0.12);--primary:#ef4444;--primary-dim:rgba(239,68,68,0.12);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px;}
  .header{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
  .back-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:0.8rem;font-weight:600;text-decoration:none;transition:all 0.2s;}
  .back-btn:hover{color:var(--text);border-color:var(--primary);}
  .page-title{font-size:1.1rem;font-weight:900;flex:1;}
  .body{max-width:640px;margin:0 auto;padding:18px 14px;}

  /* TABS */
  .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab-btn{flex:1;padding:11px 0;font-size:0.82rem;font-weight:700;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
  .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

  /* PODIUM */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:24px;padding-top:10px;}
  .podium-slot{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .podium-slot.p1{order:2;}
  .podium-slot.p2{order:1;}
  .podium-slot.p3{order:3;}
  .p-avatar{font-size:1.8rem;margin-bottom:6px;position:relative;}
  .p-crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:1rem;}
  .p-name{font-size:0.72rem;font-weight:800;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
  .p-xp{font-size:0.62rem;color:var(--muted);margin-bottom:5px;}
  .p-base{border-radius:10px 10px 0 0;width:80px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;color:#fff;}
  .p-base.gold{background:linear-gradient(180deg,#f59e0b,#d97706);height:80px;}
  .p-base.silver{background:linear-gradient(180deg,#94a3b8,#64748b);height:60px;}
  .p-base.bronze{background:linear-gradient(180deg,#b45309,#92400e);height:48px;}
  .p-base.you-glow{box-shadow:0 0 18px rgba(76,175,80,0.6);}

  /* LEADERBOARD LIST */
  .lb-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:11px 14px;margin-bottom:8px;transition:all 0.18s;animation:rowIn 0.3s ease;}
  @keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  .lb-row.is-you{border-color:var(--primary);background:var(--primary-dim);}
  .lb-rank{font-size:0.85rem;font-weight:900;width:26px;text-align:center;flex-shrink:0;}
  .lb-avatar{font-size:1.4rem;flex-shrink:0;}
  .lb-info{flex:1;min-width:0;}
  .lb-name{font-size:0.88rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-sub{font-size:0.64rem;color:var(--muted);margin-top:1px;}
  .lb-right{text-align:right;flex-shrink:0;}
  .lb-xp{font-size:0.9rem;font-weight:900;}
  .lb-league{font-size:0.62rem;color:var(--muted);}
  .lb-you-badge{font-size:0.55rem;font-weight:800;background:var(--primary);color:#fff;padding:1px 5px;border-radius:4px;vertical-align:middle;margin-left:4px;}
  .bot-label{font-size:0.55rem;color:rgba(255,255,255,0.2);font-style:italic;}

  /* WEEKLY QUESTS */
  .week-quests{display:flex;flex-direction:column;gap:10px;}
  .wq-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:all 0.2s;}
  .wq-card.done{border-color:rgba(74,222,128,0.3);background:rgba(74,222,128,0.04);}
  .wq-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .wq-icon{font-size:1.4rem;flex-shrink:0;}
  .wq-info{flex:1;}
  .wq-name{font-size:0.88rem;font-weight:800;}
  .wq-desc{font-size:0.7rem;color:var(--muted);margin-top:1px;}
  .wq-tier{font-size:0.6rem;font-weight:800;padding:2px 7px;border-radius:6px;border:1px solid;}
  .wq-tier.easy  {color:#4ade80;border-color:#4ade8040;}
  .wq-tier.medium{color:#facc15;border-color:#facc1540;}
  .wq-tier.hard  {color:#f87171;border-color:#f8717140;}
  .wq-tier.elite {color:#a78bfa;border-color:#a78bfa40;}
  .wq-reward{display:flex;gap:8px;font-size:0.7rem;font-weight:700;margin-bottom:6px;}
  .wq-reward .r-xp{color:#4ade80;}
  .wq-reward .r-gem{color:#a78bfa;}
  .wq-progress-wrap{height:6px;background:var(--card);border-radius:3px;overflow:hidden;}
  .wq-progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
  .wq-footer{display:flex;justify-content:space-between;font-size:0.65rem;color:var(--muted);margin-top:4px;}
  .section-label{font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:10px;}

  /* COUNTDOWN */
  .week-countdown{background:var(--card);border-radius:10px;padding:8px 14px;font-size:0.75rem;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .week-countdown strong{color:var(--text);}
</style>
</head>
<body>
<header class="header">
  <a href="monthly.html" class="back-btn">← Home</a>
  <div class="page-title">🏆 Leaderboard</div>
</header>

<div class="body">
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('global')"  id="tabGlobal">🌍 Global</button>
    <button class="tab-btn"        onclick="showTab('friends')" id="tabFriends">👥 Friends</button>
    <button class="tab-btn"        onclick="showTab('weekly')"  id="tabWeekly">📅 Weekly Quests</button>
  </div>

  <div id="panelGlobal">
    <div class="podium" id="podium"></div>
    <div class="section-label">All Players — This Week</div>
    <div id="globalList"></div>
  </div>

  <div id="panelFriends" style="display:none">
    <div class="podium" id="podiumFriends"></div>
    <div class="section-label">Friends Leaderboard</div>
    <div id="friendsList"></div>
  </div>

  <div id="panelWeekly" style="display:none">
    <div class="week-countdown" id="weekCountdown"></div>
    <div class="section-label">This Week's Quests</div>
    <div class="week-quests" id="weeklyQuestsList"></div>
  </div>
</div>

<script>
  const authUser = JSON.parse(localStorage.getItem("auth_user"));
  if (!authUser) window.location.href = "auth.html";
  document.body.setAttribute("data-theme", localStorage.getItem("habitTheme") || "dark");

  const STORAGE_KEY  = `habitTracker_${authUser.id}`;
  const data         = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

  const LEAGUES = [
    {name:"Bronze",emoji:"🥉",color:"#cd7f32",xp:0},{name:"Silver",emoji:"🥈",color:"#94a3b8",xp:300},
    {name:"Gold",emoji:"🥇",color:"#facc15",xp:800},{name:"Platinum",emoji:"💠",color:"#7dd3fc",xp:1800},
    {name:"Diamond",emoji:"💎",color:"#38bdf8",xp:3500},{name:"Obsidian",emoji:"🖤",color:"#475569",xp:6000},
    {name:"Emerald",emoji:"💚",color:"#4ade80",xp:10000},{name:"Ruby",emoji:"❤️",color:"#f43f5e",xp:16000},
    {name:"Mythic",emoji:"🌌",color:"#a78bfa",xp:25000},{name:"Legendary",emoji:"👑",color:"#ffd700",xp:40000},
  ];
  const getLeague = (lxp) => { let l = LEAGUES[0]; LEAGUES.forEach(lg => { if (lxp >= lg.xp) l = lg; }); return l; };

  const getWeekKey = () => {
    const d = new Date(), dow = d.getDay()===0?6:d.getDay()-1;
    const mon = new Date(d); mon.setDate(d.getDate()-dow);
    return `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,"0")}-${String(mon.getDate()).padStart(2,"0")}`;
  };
  const wk = getWeekKey();

  /* ── Build player list ── */
  const buildPlayers = (filterFriendIds = null) => {
    const users  = JSON.parse(localStorage.getItem("habitTracker_users")) || {};
    const myLXP  = data.xp?.lifetimeXP || 0;
    const myWXP  = data.league?.weekKey === wk ? (data.league?.weeklyXP||0) : 0;
    const myLg   = getLeague(myLXP);

    const players = [];

    // Real users
    Object.values(users).forEach(u => {
      if (filterFriendIds && !filterFriendIds.includes(u.id) && u.id !== authUser.id) return;
      const ud   = JSON.parse(localStorage.getItem(`habitTracker_${u.id}`)) || {};
      const lxp  = ud.xp?.lifetimeXP || 0;
      const wxp  = ud.league?.weekKey === wk ? (ud.league?.weeklyXP || 0) : 0;
      const lg   = getLeague(lxp);
      const prof = ud.profile || {};
      players.push({
        id: u.id, name: prof.displayName || u.name || u.username,
        avatar: u.avatar || prof.avatar || "😊",
        username: u.username, lxp, wxp, lg, isYou: u.id === authUser.id, real: true,
      });
    });

    // If not enough players for global, add bots
    if (!filterFriendIds && players.length < 10) {
      const seed = parseInt(wk.replace(/-/g,""),10);
      const bots = [
        {name:"Alex",avatar:"🦊"},{name:"Jordan",avatar:"🐯"},{name:"Sam",avatar:"🦁"},
        {name:"Riley",avatar:"🐺"},{name:"Casey",avatar:"🦅"},{name:"Morgan",avatar:"🐉"},
        {name:"Quinn",avatar:"⚡"},{name:"Avery",avatar:"🌟"},{name:"Blake",avatar:"🎯"},
      ].slice(0, 10 - players.length).map((b,i) => {
        const h  = ((seed*(i+7)*1664525+22695477)>>>0)%1000;
        const wxp = Math.max(0, Math.round(myWXP*(0.4+(h/1000)*1.6)));
        const lxp = wxp * 4 + Math.round(h * 8);
        return { id:"bot_"+i, name:b.name, avatar:b.avatar, username:null,
                 lxp, wxp, lg:getLeague(lxp), isYou:false, real:false };
      });
      players.push(...bots);
    }

    players.sort((a,b) => b.wxp - a.wxp);
    return players;
  };

  /* ── Render Podium ── */
  const renderPodium = (players, elId) => {
    const el = document.getElementById(elId);
    if (players.length < 3) { el.style.display="none"; return; }
    const [p1,p2,p3] = players;
    const glow = (p) => p.isYou ? "you-glow" : "";
    el.innerHTML = `
      <div class="podium-slot p2">
        <div class="p-avatar">${p2.avatar}</div>
        <div class="p-name">${p2.name}</div>
        <div class="p-xp">${p2.wxp} XP</div>
        <div class="p-base silver ${glow(p2)}">2</div>
      </div>
      <div class="podium-slot p1">
        <div class="p-avatar" style="position:relative">
          <span class="p-crown">👑</span>${p1.avatar}
        </div>
        <div class="p-name">${p1.name}</div>
        <div class="p-xp">${p1.wxp} XP</div>
        <div class="p-base gold ${glow(p1)}">1</div>
      </div>
      <div class="podium-slot p3">
        <div class="p-avatar">${p3.avatar}</div>
        <div class="p-name">${p3.name}</div>
        <div class="p-xp">${p3.wxp} XP</div>
        <div class="p-base bronze ${glow(p3)}">3</div>
      </div>`;
  };

  /* ── Render List ── */
  const renderList = (players, elId, showFromRank=4) => {
    const el    = document.getElementById(elId);
    const slice = players.slice(showFromRank - 1);
    el.innerHTML = "";
    slice.forEach((p, i) => {
      const rank = i + showFromRank;
      const row  = document.createElement("div");
      row.className = `lb-row ${p.isYou ? "is-you" : ""}`;
      row.style.animationDelay = (i * 30) + "ms";
      row.innerHTML = `
        <div class="lb-rank">${rank}</div>
        <div class="lb-avatar">${p.avatar}</div>
        <div class="lb-info">
          <div class="lb-name">
            ${p.name}${p.isYou ? `<span class="lb-you-badge">YOU</span>` : ""}
          </div>
          <div class="lb-sub">
            ${p.real && p.username ? `@${p.username} · ` : ""}${p.lg.emoji} ${p.lg.name}
            ${!p.real ? `<span class="bot-label">bot</span>` : ""}
          </div>
        </div>
        <div class="lb-right">
          <div class="lb-xp">${p.wxp.toLocaleString()} XP</div>
          <div class="lb-league">This week</div>
        </div>`;
      el.appendChild(row);
    });
  };

  /* ── Tab logic ── */
  const showTab = (name) => {
    ["Global","Friends","Weekly"].forEach(n => {
      document.getElementById("panel"+n).style.display   = name.toLowerCase()===n.toLowerCase() ? "" : "none";
      document.getElementById("tab"+n).classList.toggle("active", name.toLowerCase()===n.toLowerCase());
    });
  };
  window.showTab = showTab;

  /* ── Weekly Quests ── */
  const WEEKLY_QUESTS = [
    {
      id:"w_habit_35", name:"Habit Machine", icon:"⚙️", tier:"easy",
      desc:"Complete 35 habits this week",
      xp:150, gems:50,
      check: () => {
        const today = new Date(); let total = 0;
        const dow   = today.getDay()===0?6:today.getDay()-1;
        for (let dOff=0; dOff<=dow; dOff++) {
          const d2 = new Date(today); d2.setDate(today.getDate()-dOff);
          const mk = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,"0")}`;
          const mo = data[mk]; if (!mo?.tasks) continue;
          const idx = d2.getDate()-1;
          total += mo.tasks.filter(t => t.days[idx]==="done").length;
        }
        return Math.min(total, 35);
      }, target:35
    },
    {
      id:"w_perfect_3", name:"Triple Star", icon:"⭐", tier:"medium",
      desc:"Get 3 perfect days this week",
      xp:200, gems:75,
      check: () => {
        const today = new Date(); let perfect = 0;
        const dow   = today.getDay()===0?6:today.getDay()-1;
        for (let dOff=0; dOff<=dow; dOff++) {
          const d2 = new Date(today); d2.setDate(today.getDate()-dOff);
          const mk = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,"0")}`;
          const mo = data[mk]; if (!mo?.tasks) continue;
          const idx = d2.getDate()-1;
          const act = mo.tasks.filter(t=>t.days[idx]!=="locked");
          if (act.length && act.every(t=>t.days[idx]==="done")) perfect++;
        }
        return Math.min(perfect, 3);
      }, target:3
    },
    {
      id:"w_xp_500", name:"XP Grinder", icon:"⚡", tier:"medium",
      desc:"Earn 500 XP this week",
      xp:100, gems:40,
      check: () => Math.min(data.league?.weekKey===wk ? (data.league?.weeklyXP||0) : 0, 500),
      target:500
    },
    {
      id:"w_no_miss_5", name:"Flawless Week", icon:"🛡️", tier:"hard",
      desc:"Zero failed habits for 5 days straight",
      xp:300, gems:100,
      check: () => {
        const today = new Date(); let streak = 0;
        for (let dOff=0; dOff<7; dOff++) {
          const d2  = new Date(today); d2.setDate(today.getDate()-dOff);
          const mk  = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,"0")}`;
          const mo  = data[mk]; if (!mo?.tasks) break;
          const idx = d2.getDate()-1;
          const act = mo.tasks.filter(t=>t.days[idx]!=="locked");
          if (!act.length) continue;
          if (act.some(t=>t.days[idx]==="failed")) break;
          streak++;
        }
        return Math.min(streak, 5);
      }, target:5
    },
    {
      id:"w_streak_7", name:"Week of Fire", icon:"🔥", tier:"hard",
      desc:"Maintain your habit streak for the full 7 days",
      xp:250, gems:80,
      check: () => {
        // simplified: use loginStreak count capped at 7
        return Math.min(data.loginStreak?.count||0, 7);
      }, target:7
    },
    {
      id:"w_elite_100pct", name:"Elite Week", icon:"💎", tier:"elite",
      desc:"100% completion every single day this week",
      xp:500, gems:200,
      check: () => {
        const today = new Date(); let days = 0;
        const dow   = today.getDay()===0?6:today.getDay()-1;
        for (let dOff=0; dOff<=Math.min(dow,6); dOff++) {
          const d2  = new Date(today); d2.setDate(today.getDate()-dOff);
          const mk  = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,"0")}`;
          const mo  = data[mk]; if (!mo?.tasks) continue;
          const idx = d2.getDate()-1;
          const act = mo.tasks.filter(t=>t.days[idx]!=="locked");
          if (!act.length) continue;
          if (act.every(t=>t.days[idx]==="done")) days++;
          else break;
        }
        return Math.min(days, 7);
      }, target:7
    },
  ];

  const TIER_COLORS = {easy:"#4ade80",medium:"#facc15",hard:"#f87171",elite:"#a78bfa"};

  const renderWeeklyQuests = () => {
    const el   = document.getElementById("weeklyQuestsList");
    const wqData = data.weeklyQuests || {};
    const isCurWeek = (wqData.weekKey === wk);
    const completedIds = isCurWeek ? (wqData.completed || []) : [];

    el.innerHTML = "";
    WEEKLY_QUESTS.forEach(q => {
      const prog  = q.check();
      const done  = completedIds.includes(q.id) || prog >= q.target;
      const pct   = Math.min(100, Math.round(prog / q.target * 100));
      const color = TIER_COLORS[q.tier];

      const card = document.createElement("div");
      card.className = `wq-card ${done ? "done" : ""}`;
      card.innerHTML = `
        <div class="wq-header">
          <div class="wq-icon">${q.icon}</div>
          <div class="wq-info">
            <div class="wq-name">${q.name} ${done ? "✓" : ""}</div>
            <div class="wq-desc">${q.desc}</div>
          </div>
          <div class="wq-tier ${q.tier}">${q.tier.toUpperCase()}</div>
        </div>
        <div class="wq-reward">
          <span class="r-xp">+${q.xp} XP</span>
          <span class="r-gem">+${q.gems} 💎</span>
        </div>
        <div class="wq-progress-wrap">
          <div class="wq-progress-fill"
            style="width:${pct}%;background:${done?"#4ade80":color}"></div>
        </div>
        <div class="wq-footer">
          <span>${prog} / ${q.target}</span>
          <span>${pct}%</span>
        </div>`;
      el.appendChild(card);
    });
  };

  /* ── Week countdown ── */
  const renderCountdown = () => {
    const now  = new Date();
    const dow  = now.getDay()===0?6:now.getDay()-1;
    const sun  = new Date(now); sun.setDate(now.getDate()+(6-dow)); sun.setHours(23,59,59,999);
    const ms   = sun - now;
    const d    = Math.floor(ms/86400000);
    const h    = Math.floor((ms%86400000)/3600000);
    const m    = Math.floor((ms%3600000)/60000);
    document.getElementById("weekCountdown").innerHTML =
      `Week resets in <strong>${d}d ${h}h ${m}m</strong> · ${wk} season`;
  };

  /* ── Init ── */
  const global  = buildPlayers();
  const social  = JSON.parse(localStorage.getItem(`habitSocial_${authUser.id}`)) || { friends:[] };
  const friends = buildPlayers(social.friends);

  renderPodium(global,  "podium");
  renderPodium(friends, "podiumFriends");
  renderList(global,    "globalList");
  renderList(friends,   "friendsList");
  renderWeeklyQuests();
  renderCountdown();
</script>
</body>
</html>
