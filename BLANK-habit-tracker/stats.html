<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats · Habit Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--panel:#111118;--card:#161622;--border:rgba(255,255,255,0.07);--text:#eeeef5;--muted:#6b7280;--primary:#4CAF50;--done:#4ade80;--missed:#f87171;}
[data-theme="light"]  {--bg:#f5f6fa;--panel:#fff;--card:#f0f1f8;--border:rgba(0,0,0,0.08);--text:#111827;--muted:#6b7280;--primary:#16a34a;--done:#16a34a;--missed:#dc2626;}
[data-theme="pink"]   {--bg:#1a0814;--panel:#220d1a;--card:#2c1020;--border:rgba(244,114,182,0.12);--text:#fce7f3;--muted:#c084a8;--primary:#f472b6;--done:#f472b6;--missed:#fb7185;}
[data-theme="blue"]   {--bg:#060d1a;--panel:#0c1628;--card:#101e34;--border:rgba(96,165,250,0.1);--text:#dbeafe;--muted:#6b96cc;--primary:#60a5fa;--done:#34d399;--missed:#f87171;}
[data-theme="yellow"] {--bg:#0f0d00;--panel:#1a1600;--card:#221e00;--border:rgba(251,191,36,0.12);--text:#fef9c3;--muted:#a89020;--primary:#fbbf24;--done:#fbbf24;--missed:#f87171;}
[data-theme="army"]   {--bg:#080f08;--panel:#0f1a0f;--card:#152015;--border:rgba(132,204,22,0.1);--text:#d9f0d9;--muted:#6b8a5a;--primary:#84cc16;--done:#84cc16;--missed:#f87171;}
[data-theme="ferrari"]{--bg:#0f0202;--panel:#1a0404;--card:#220606;--border:rgba(239,68,68,0.12);--text:#fee2e2;--muted:#996060;--primary:#ef4444;--done:#ef4444;--missed:#fb923c;}
[data-theme="midnight"]{--bg:#030308;--panel:#080812;--card:#0d0d1c;--border:rgba(167,139,250,0.1);--text:#ede9fe;--muted:#7c6ba0;--primary:#a78bfa;--done:#a78bfa;--missed:#f87171;}
[data-theme="ocean"]  {--bg:#020c14;--panel:#051422;--card:#081c30;--border:rgba(6,182,212,0.1);--text:#cffafe;--muted:#4d8fa0;--primary:#06b6d4;--done:#06b6d4;--missed:#f87171;}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}

.header{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;backdrop-filter:blur(8px);}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:0.8rem;font-weight:600;text-decoration:none;transition:all 0.2s;}
.back-btn:hover{color:var(--text);border-color:var(--primary);}
.page-title{font-size:1.1rem;font-weight:900;flex:1;}
.period-select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 8px;font-size:0.78rem;font-family:inherit;outline:none;}

.body{max-width:700px;margin:0 auto;padding:18px 14px;}

/* HERO STATS */
.hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
@media(min-width:500px){.hero-grid{grid-template-columns:repeat(4,1fr);}}
.hero-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 12px;text-align:center;position:relative;overflow:hidden;transition:transform 0.2s;}
.hero-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -20%,var(--primary-glow,rgba(76,175,80,0.08)),transparent 70%);pointer-events:none;}
.hero-card:hover{transform:translateY(-2px);}
.hero-val{font-size:1.8rem;font-weight:900;line-height:1;}
.hero-lbl{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-top:4px;}
.hero-trend{font-size:0.65rem;margin-top:4px;font-weight:700;}
.trend-up{color:var(--done);}
.trend-down{color:var(--missed);}

/* SECTION */
.section{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
.section-title{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}

/* BAR CHART */
.bar-chart{display:flex;flex-direction:column;gap:8px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{font-size:0.75rem;font-weight:700;width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:10px;background:var(--card);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width 0.7s cubic-bezier(0.34,1.2,0.64,1);}
.bar-val{font-size:0.72rem;font-weight:700;width:36px;text-align:right;flex-shrink:0;}

/* HEATMAP */
.heatmap-wrap{display:flex;flex-wrap:wrap;gap:3px;}
.hm-cell{width:14px;height:14px;border-radius:3px;background:var(--card);transition:opacity 0.2s;}
.hm-cell:hover{opacity:0.7;cursor:default;}
.hm-l1{background:color-mix(in srgb,var(--primary) 25%,transparent);}
.hm-l2{background:color-mix(in srgb,var(--primary) 50%,transparent);}
.hm-l3{background:color-mix(in srgb,var(--primary) 75%,transparent);}
.hm-l4{background:var(--primary);}
.hm-month-labels{display:flex;gap:3px;margin-bottom:3px;font-size:0.55rem;color:var(--muted);}

/* MOOD CHART */
.mood-bars{display:flex;gap:6px;align-items:flex-end;height:80px;margin-bottom:8px;}
.mood-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.mood-bar{width:100%;border-radius:4px 4px 0 0;transition:height 0.6s ease;min-height:2px;}
.mood-bar-emoji{font-size:1rem;}
.mood-bar-count{font-size:0.62rem;color:var(--muted);font-weight:700;}

/* DAY-OF-WEEK */
.dow-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.dow-cell{background:var(--card);border-radius:8px;padding:8px 4px;text-align:center;}
.dow-day{font-size:0.6rem;color:var(--muted);margin-bottom:4px;font-weight:700;}
.dow-pct{font-size:0.9rem;font-weight:900;}
.dow-bar{height:4px;border-radius:2px;margin-top:4px;transition:width 0.6s ease;}

/* HABIT LEADERBOARD */
.habit-lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.habit-lb-row:last-child{border-bottom:none;}
.habit-lb-rank{font-size:0.8rem;font-weight:900;width:20px;text-align:center;flex-shrink:0;color:var(--muted);}
.habit-lb-name{flex:1;font-size:0.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.habit-lb-streak{font-size:0.7rem;color:var(--muted);}
.habit-lb-pct{font-size:0.82rem;font-weight:900;width:42px;text-align:right;}

/* TIME DISTRIBUTION */
.time-grid{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-bottom:4px;}
.time-cell{height:20px;border-radius:2px;background:var(--card);}
.time-labels{display:flex;justify-content:space-between;font-size:0.56rem;color:var(--muted);}

/* EMPTY */
.empty-state{text-align:center;padding:32px 16px;color:var(--muted);}
</style>
</head>
<body>
<header class="header">
  <a href="monthly.html" class="back-btn">← Home</a>
  <div class="page-title">📊 Analytics</div>
  <select class="period-select" id="periodSelect" onchange="rebuild()">
    <option value="30">Last 30 days</option>
    <option value="90">Last 90 days</option>
    <option value="180">Last 6 months</option>
    <option value="365">Last year</option>
    <option value="all">All time</option>
  </select>
</header>
<div class="body">
  <div class="hero-grid" id="heroGrid"></div>
  <div id="sections"></div>
</div>

<script>
const authUser = JSON.parse(localStorage.getItem("auth_user"));
if (!authUser) window.location.href = "auth.html";
document.body.setAttribute("data-theme", localStorage.getItem("habitTheme") || "dark");

const STORAGE_KEY = `habitTracker_${authUser.id}`;
const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

const MOODS = [
  {val:5,emoji:"🤩",label:"Amazing",color:"#4ade80"},
  {val:4,emoji:"😊",label:"Good",   color:"#a3e635"},
  {val:3,emoji:"😐",label:"Okay",   color:"#facc15"},
  {val:2,emoji:"😔",label:"Low",    color:"#fb923c"},
  {val:1,emoji:"😫",label:"Rough",  color:"#f87171"},
];

/* ── Date helpers ── */
const today     = new Date();
const todayStr  = today.toISOString().slice(0,10);

const dateRange = (days) => {
  const dates = [];
  const end   = days === "all" ? 365 : parseInt(days);
  for (let i = end - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    dates.push(d);
  }
  return dates;
};

const mkKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const dkKey = (d) => d.toISOString().slice(0,10);

/* ── Core stats computation ── */
const computeStats = (days) => {
  const dates   = dateRange(days);
  const stats   = { done:0, total:0, perfectDays:0, failedDays:0, byHabit:{}, byDow:Array(7).fill(null).map(()=>({done:0,total:0})), byHour:Array(24).fill(0), dailyPct:[] };
  const habitMap = {}; // name → {done, total, streak, lastDone}

  dates.forEach(d => {
    const mk  = mkKey(d);
    const month = data[mk];
    if (!month?.tasks?.length) { stats.dailyPct.push(null); return; }
    const idx = d.getDate() - 1;
    const dow = (d.getDay() + 6) % 7; // Mon=0

    const active = month.tasks.filter(t => t.days[idx] !== "locked");
    if (!active.length) { stats.dailyPct.push(null); return; }

    let dayDone = 0;
    active.forEach(t => {
      stats.total++;
      const nm = t.name;
      if (!habitMap[nm]) habitMap[nm] = { done:0, total:0, streak:0, lastDone:null };
      habitMap[nm].total++;
      stats.byDow[dow].total++;
      if (t.days[idx] === "done") {
        stats.done++; dayDone++;
        habitMap[nm].done++;
        stats.byDow[dow].done++;
      }
    });

    const pct = Math.round(dayDone / active.length * 100);
    stats.dailyPct.push(pct);
    if (pct === 100) stats.perfectDays++;
    if (pct === 0 && active.length > 0) stats.failedDays++;
  });

  // Habit completion %
  stats.habitRankings = Object.entries(habitMap)
    .map(([name, h]) => ({ name, pct: Math.round(h.done/h.total*100), done:h.done, total:h.total }))
    .filter(h => h.total >= 3)
    .sort((a,b) => b.pct - a.pct);

  stats.overallPct = stats.total > 0 ? Math.round(stats.done/stats.total*100) : 0;
  stats.avgPct     = (() => {
    const valid = stats.dailyPct.filter(p => p !== null);
    return valid.length ? Math.round(valid.reduce((a,b)=>a+b,0)/valid.length) : 0;
  })();

  return stats;
};

const computeMoodStats = () => {
  const moods  = data.moods || {};
  const counts = {5:0,4:0,3:0,2:0,1:0};
  let streak = 0, best = 0;
  let prev = null;
  Object.entries(moods).sort().forEach(([dk,m]) => {
    if (!m?.val) return;
    counts[m.val]++;
    if (m.val >= 4) { streak++; best = Math.max(best,streak); }
    else streak = 0;
  });
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const avg   = total > 0 ? Object.entries(counts).reduce((a,[v,c])=>a+(v*c),0)/total : 0;
  return { counts, total, avg: Math.round(avg*10)/10, bestStreak: best };
};

/* ── Build page ── */
const rebuild = () => {
  const period = document.getElementById("periodSelect").value;
  const s      = computeStats(period);
  const ms     = computeMoodStats();
  const xp     = data.xp || { level:1, lifetimeXP:0 };
  const streak = data.loginStreak?.count || 0;

  /* HERO CARDS */
  document.getElementById("heroGrid").innerHTML = `
    <div class="hero-card">
      <div class="hero-val" style="color:var(--primary)">${s.overallPct}%</div>
      <div class="hero-lbl">Completion Rate</div>
      <div class="hero-trend ${s.overallPct >= 70 ? "trend-up" : "trend-down"}">${s.overallPct >= 70 ? "↑ On track" : "↓ Needs work"}</div>
    </div>
    <div class="hero-card">
      <div class="hero-val" style="color:#fb923c">${streak}🔥</div>
      <div class="hero-lbl">Current Streak</div>
    </div>
    <div class="hero-card">
      <div class="hero-val" style="color:#facc15">⭐${s.perfectDays}</div>
      <div class="hero-lbl">Perfect Days</div>
    </div>
    <div class="hero-card">
      <div class="hero-val" style="color:#a78bfa">LV${xp.level}</div>
      <div class="hero-lbl">${(xp.lifetimeXP||0).toLocaleString()} XP</div>
    </div>`;

  const sections = document.getElementById("sections");
  sections.innerHTML = "";

  /* ── COMPLETION TREND ── */
  const trendSec = mkSection("📈 Completion Trend");
  const trendCanvas = document.createElement("canvas");
  trendCanvas.height = 120;
  trendSec.appendChild(trendCanvas);
  sections.appendChild(trendSec);
  drawTrend(trendCanvas, s.dailyPct);

  /* ── HEATMAP ── */
  const hmSec = mkSection("🗓️ Activity Heatmap");
  const hmWrap = document.createElement("div");
  hmWrap.className = "heatmap-wrap";
  const dates = dateRange(period);
  dates.forEach(d => {
    const cell = document.createElement("div");
    cell.className = "hm-cell";
    const mk  = mkKey(d);
    const idx = d.getDate()-1;
    const mo  = data[mk];
    let pct   = 0;
    if (mo?.tasks?.length) {
      const act = mo.tasks.filter(t => t.days[idx] !== "locked");
      if (act.length) {
        const dn = act.filter(t => t.days[idx] === "done").length;
        pct = dn / act.length;
      }
    }
    if (pct >= 1)       cell.classList.add("hm-l4");
    else if (pct >= .75) cell.classList.add("hm-l3");
    else if (pct >= .5)  cell.classList.add("hm-l2");
    else if (pct > 0)    cell.classList.add("hm-l1");
    cell.title = `${dkKey(d)}: ${Math.round(pct*100)}%`;
    hmWrap.appendChild(cell);
  });
  hmSec.appendChild(hmWrap);
  hmSec.appendChild(mkLegend());
  sections.appendChild(hmSec);

  /* ── BEST & WORST HABITS ── */
  if (s.habitRankings.length) {
    const habitSec = mkSection("🏅 Habit Performance");
    const chart    = document.createElement("div");
    chart.className = "bar-chart";
    s.habitRankings.slice(0,8).forEach((h,i) => {
      const color = h.pct >= 80 ? "#4ade80" : h.pct >= 50 ? "#facc15" : "#f87171";
      chart.innerHTML += `
        <div class="bar-row">
          <div class="bar-label" title="${h.name}">${i+1}. ${h.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:0%;background:${color}" data-w="${h.pct}"></div></div>
          <div class="bar-val" style="color:${color}">${h.pct}%</div>
        </div>`;
    });
    habitSec.appendChild(chart);
    sections.appendChild(habitSec);
    // Animate bars after insert
    requestAnimationFrame(() => {
      habitSec.querySelectorAll(".bar-fill").forEach(b => {
        setTimeout(() => b.style.width = b.dataset.w + "%", 50);
      });
    });
  }

  /* ── DAY-OF-WEEK ── */
  const dowSec  = mkSection("📅 Best Days of the Week");
  const dowGrid = document.createElement("div");
  dowGrid.className = "dow-grid";
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const maxDow = Math.max(...s.byDow.map(d => d.total > 0 ? d.done/d.total : 0), 0.01);
  s.byDow.forEach((d, i) => {
    const pct   = d.total > 0 ? Math.round(d.done/d.total*100) : 0;
    const ratio = d.total > 0 ? (d.done/d.total) / maxDow : 0;
    const color = pct >= 80 ? "#4ade80" : pct >= 50 ? "#facc15" : "#f87171";
    dowGrid.innerHTML += `
      <div class="dow-cell">
        <div class="dow-day">${DAYS[i]}</div>
        <div class="dow-pct" style="color:${color}">${pct}%</div>
        <div class="dow-bar" style="background:${color};width:${Math.round(ratio*100)}%"></div>
      </div>`;
  });
  dowSec.appendChild(dowGrid);
  sections.appendChild(dowSec);

  /* ── MOOD STATS ── */
  if (ms.total > 0) {
    const moodSec  = mkSection(`😊 Mood Tracker · ${ms.total} entries · avg ${ms.avg}/5`);
    const moodBars = document.createElement("div");
    moodBars.className = "mood-bars";
    const maxCount = Math.max(...Object.values(ms.counts), 1);
    MOODS.forEach(m => {
      const cnt = ms.counts[m.val] || 0;
      const h   = Math.round((cnt / maxCount) * 72);
      moodBars.innerHTML += `
        <div class="mood-bar-wrap">
          <div class="mood-bar-count">${cnt}</div>
          <div class="mood-bar" style="height:${h}px;background:${m.color}"></div>
          <div class="mood-bar-emoji">${m.emoji}</div>
        </div>`;
    });
    moodSec.appendChild(moodBars);
    sections.appendChild(moodSec);
  }

  /* ── XP HISTORY ── */
  const xpSec = mkSection("⚡ Progress Summary");
  xpSec.innerHTML += `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:var(--card);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:1.4rem;font-weight:900;color:#facc15">${(xp.lifetimeXP||0).toLocaleString()}</div>
        <div style="font-size:0.62rem;color:var(--muted);text-transform:uppercase;margin-top:2px">Lifetime XP</div>
      </div>
      <div style="background:var(--card);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:1.4rem;font-weight:900;color:#a78bfa">Lv ${xp.level}</div>
        <div style="font-size:0.62rem;color:var(--muted);text-transform:uppercase;margin-top:2px">Current Level</div>
      </div>
      <div style="background:var(--card);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:1.4rem;font-weight:900;color:#4ade80">${s.perfectDays}</div>
        <div style="font-size:0.62rem;color:var(--muted);text-transform:uppercase;margin-top:2px">Perfect Days</div>
      </div>
      <div style="background:var(--card);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:1.4rem;font-weight:900;color:#fb923c">${data.gems?.total||0}💎</div>
        <div style="font-size:0.62rem;color:var(--muted);text-transform:uppercase;margin-top:2px">Gems Earned</div>
      </div>
    </div>`;
  sections.appendChild(xpSec);
};

/* ── Canvas trend chart ── */
const drawTrend = (canvas, dailyPct) => {
  const parent = canvas.parentElement;
  canvas.width  = parent.offsetWidth || 600;
  canvas.height = 120;
  const ctx     = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const pad = { t:10, r:10, b:24, l:30 };
  const iw  = w - pad.l - pad.r;
  const ih  = h - pad.t - pad.b;

  ctx.clearRect(0, 0, w, h);

  const valid = dailyPct.filter(p => p !== null);
  if (!valid.length) return;

  // Grid lines
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--border") || "rgba(255,255,255,0.07)";
  ctx.lineWidth   = 1;
  [0,25,50,75,100].forEach(pct => {
    const y = pad.t + ih - (pct/100)*ih;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--muted") || "#6b7280";
    ctx.font = "9px sans-serif"; ctx.textAlign = "right";
    ctx.fillText(pct+"%", pad.l-4, y+3);
  });

  // Fill gradient
  const primaryColor = getComputedStyle(document.body).getPropertyValue("--primary").trim() || "#4CAF50";
  const grad = ctx.createLinearGradient(0, pad.t, 0, h-pad.b);
  grad.addColorStop(0, primaryColor + "55");
  grad.addColorStop(1, primaryColor + "00");

  const pts = dailyPct.map((p, i) => ({
    x: pad.l + (i / (dailyPct.length-1)) * iw,
    y: p === null ? null : pad.t + ih - (p/100)*ih,
  }));

  // Draw fill
  ctx.beginPath();
  let first = true;
  pts.forEach((pt, i) => {
    if (pt.y === null) return;
    if (first) { ctx.moveTo(pt.x, pt.y); first = false; }
    else ctx.lineTo(pt.x, pt.y);
  });
  if (pts.length) {
    const last = pts.filter(p=>p.y!==null).slice(-1)[0];
    if (last) { ctx.lineTo(last.x, h-pad.b); ctx.lineTo(pad.l, h-pad.b); }
  }
  ctx.fillStyle = grad; ctx.fill();

  // Draw line
  ctx.beginPath(); first = true;
  pts.forEach(pt => {
    if (pt.y === null) return;
    if (first) { ctx.moveTo(pt.x, pt.y); first = false; }
    else ctx.lineTo(pt.x, pt.y);
  });
  ctx.strokeStyle = primaryColor; ctx.lineWidth = 2; ctx.lineJoin = "round";
  ctx.stroke();

  // 7-day moving average
  const ma = dailyPct.map((_,i) => {
    const slice = dailyPct.slice(Math.max(0,i-3), i+4).filter(p=>p!==null);
    return slice.length ? slice.reduce((a,b)=>a+b,0)/slice.length : null;
  });
  ctx.beginPath(); first = true;
  ma.forEach((v,i) => {
    if (v===null) return;
    const x = pad.l + (i/(dailyPct.length-1))*iw;
    const y = pad.t + ih - (v/100)*ih;
    if (first) { ctx.moveTo(x,y); first=false; } else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
  ctx.stroke(); ctx.setLineDash([]);
};

/* ── Helpers ── */
const mkSection = (title) => {
  const sec = document.createElement("div");
  sec.className = "section";
  sec.innerHTML = `<div class="section-title">${title}</div>`;
  return sec;
};

const mkLegend = () => {
  const leg = document.createElement("div");
  leg.style.cssText = "display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;";
  [["None","var(--card)"],["1–25%","var(--primary)25"],["26–50%","var(--primary)55"],["51–75%","var(--primary)aa"],["76–100%","var(--primary)"]].forEach(([lbl,col]) => {
    leg.innerHTML += `<span style="display:flex;align-items:center;gap:4px;font-size:0.6rem;color:var(--muted)">
      <span style="width:10px;height:10px;border-radius:2px;background:${col};display:inline-block"></span>${lbl}</span>`;
  });
  return leg;
};

rebuild();
window.addEventListener("resize", () => {
  const period = document.getElementById("periodSelect").value;
  const s = computeStats(period);
  const canvas = document.querySelector("canvas");
  if (canvas) drawTrend(canvas, s.dailyPct);
});
</script>
