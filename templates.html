<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templates · Habit Tracker</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0c0c14;--panel:#121220;--card:#1a1a2e;--border:rgba(255,255,255,0.08);--text:#f0f0f8;--muted:#6b7280;--primary:#4CAF50;--primary-dim:rgba(76,175,80,0.12);}
  [data-theme="light"]  {--bg:#f4f4f8;--panel:#fff;--card:#f0f0f6;--border:rgba(0,0,0,0.1);--text:#111;--muted:#666;}
  [data-theme="pink"]   {--bg:#1a0a14;--panel:#200d18;--card:#2a1020;--border:rgba(255,100,150,0.15);--primary:#f472b6;--primary-dim:rgba(244,114,182,0.12);}
  [data-theme="blue"]   {--bg:#0a1020;--panel:#0d1628;--card:#101e34;--border:rgba(100,160,255,0.12);--primary:#60a5fa;--primary-dim:rgba(96,165,250,0.12);}
  [data-theme="yellow"] {--bg:#14120a;--panel:#1c1908;--card:#26230e;--border:rgba(250,200,20,0.12);--primary:#fbbf24;--primary-dim:rgba(251,191,36,0.12);}
  [data-theme="army"]   {--bg:#0e100a;--panel:#141810;--card:#1c2214;--border:rgba(120,160,80,0.12);--primary:#84cc16;--primary-dim:rgba(132,204,22,0.12);}
  [data-theme="ferrari"]{--bg:#120808;--panel:#1a0c0c;--card:#221010;--border:rgba(255,60,60,0.12);--primary:#ef4444;--primary-dim:rgba(239,68,68,0.12);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}
  .header{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
  .back-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:0.8rem;font-weight:600;text-decoration:none;transition:all 0.2s;}
  .back-btn:hover{color:var(--text);border-color:var(--primary);}
  .page-title{font-size:1.1rem;font-weight:900;flex:1;}
  .body{max-width:640px;margin:0 auto;padding:20px 14px;}
  .intro{font-size:0.82rem;color:var(--muted);margin-bottom:20px;line-height:1.5;}

  /* CATEGORY TABS */
  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .cat-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 0.2s;color:var(--muted);}
  .cat-tab.active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary);}

  /* TEMPLATE PACK */
  .pack{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:16px;animation:packIn 0.3s ease;}
  @keyframes packIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .pack-header{display:flex;align-items:center;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--border);}
  .pack-icon{font-size:1.6rem;flex-shrink:0;}
  .pack-info{flex:1;}
  .pack-name{font-size:0.95rem;font-weight:900;}
  .pack-sub{font-size:0.72rem;color:var(--muted);margin-top:2px;}
  .pack-add-all{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:6px 14px;font-size:0.75rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity 0.2s;}
  .pack-add-all:hover{opacity:0.85;}
  .pack-habits{padding:6px 0;}
  .t-habit-row{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--border);transition:background 0.15s;}
  .t-habit-row:last-child{border-bottom:none;}
  .t-habit-row:hover{background:rgba(255,255,255,0.02);}
  .t-habit-emoji{font-size:1.1rem;flex-shrink:0;}
  .t-habit-info{flex:1;}
  .t-habit-name{font-size:0.85rem;font-weight:700;}
  .t-habit-desc{font-size:0.68rem;color:var(--muted);margin-top:1px;}
  .t-add-btn{background:var(--primary-dim);border:1px solid var(--primary);color:var(--primary);border-radius:8px;padding:4px 10px;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
  .t-add-btn:hover{background:var(--primary);color:#fff;}
  .t-add-btn.added{background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.3);color:#4ade80;cursor:default;}

  /* TOAST */
  #tToast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--primary);border-radius:12px;padding:8px 18px;font-size:0.82rem;font-weight:700;color:var(--primary);z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
  #tToast.show{opacity:1;}
</style>
</head>
<body>
<header class="header">
  <a href="monthly.html" class="back-btn">← Home</a>
  <div class="page-title">📚 Habit Templates</div>
</header>
<div class="body">
  <div class="intro">Pick from curated habit packs and add them to this month instantly. Start with what works, build from there.</div>

  <div class="cat-tabs" id="catTabs"></div>
  <div id="packsArea"></div>
</div>
<div id="tToast"></div>

<script>
  const authUser = JSON.parse(localStorage.getItem("auth_user"));
  if (!authUser) window.location.href = "auth.html";
  document.body.setAttribute("data-theme", localStorage.getItem("habitTheme") || "dark");

  const STORAGE_KEY = `habitTracker_${authUser.id}`;
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  const saveData = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

  const today = new Date();
  const mk    = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;

  const TEMPLATE_PACKS = [
    {
      id:"morning_power", name:"Morning Power Routine", icon:"🌅", cat:"Health",
      sub:"Start every day like a champion",
      habits:[
        {e:"💧",name:"Drink 500ml water",desc:"Hydrate before anything else"},
        {e:"🧘",name:"5-min meditation",desc:"Clear your mind for the day"},
        {e:"🏃",name:"Morning walk / run",desc:"Get the blood flowing"},
        {e:"📖",name:"Read 10 pages",desc:"Feed your brain daily"},
        {e:"🚿",name:"Cold shower",desc:"Shock yourself awake"},
      ]
    },
    {
      id:"fitness_beast", name:"Fitness Beast", icon:"💪", cat:"Fitness",
      sub:"Build the body you want",
      habits:[
        {e:"🏋️",name:"Workout / lift",desc:"Strength training session"},
        {e:"🥗",name:"Track calories",desc:"What gets measured gets managed"},
        {e:"🚶",name:"10,000 steps",desc:"Stay active throughout the day"},
        {e:"😴",name:"8 hours sleep",desc:"Recovery is training too"},
        {e:"🧪",name:"Take supplements",desc:"Vitamins and protein"},
      ]
    },
    {
      id:"deep_work", name:"Deep Work Mode", icon:"🧠", cat:"Productivity",
      sub:"Do more of what matters",
      habits:[
        {e:"📵",name:"No phone first hour",desc:"Protect your morning focus"},
        {e:"📝",name:"Write daily goals",desc:"3 most important tasks"},
        {e:"⏱️",name:"2hr deep work block",desc:"Distraction-free focused work"},
        {e:"📧",name:"Inbox zero",desc:"Process email in batches"},
        {e:"🔍",name:"Weekly review",desc:"Plan and reflect every Sunday"},
      ]
    },
    {
      id:"mental_health", name:"Mental Wellness", icon:"🧘", cat:"Wellbeing",
      sub:"Take care of your mind",
      habits:[
        {e:"📓",name:"Gratitude journal",desc:"Write 3 things you're grateful for"},
        {e:"🌿",name:"15-min outside time",desc:"Fresh air and nature"},
        {e:"🤸",name:"Stretch / yoga",desc:"Body and mind connection"},
        {e:"📵",name:"Social media limit",desc:"Max 30 min per day"},
        {e:"💬",name:"Connect with someone",desc:"Call or meet a friend"},
      ]
    },
    {
      id:"student_grind", name:"Student Grind", icon:"📚", cat:"Learning",
      sub:"Crush your studies",
      habits:[
        {e:"📚",name:"Study 2 hours",desc:"Focused learning block"},
        {e:"🃏",name:"Flashcard review",desc:"Active recall practice"},
        {e:"✏️",name:"Take notes",desc:"Rewrite key concepts"},
        {e:"🧩",name:"Solve problems",desc:"Practice questions"},
        {e:"😴",name:"Sleep before midnight",desc:"Rest improves retention"},
      ]
    },
    {
      id:"financial", name:"Money Moves", icon:"💰", cat:"Finance",
      sub:"Build wealth, one day at a time",
      habits:[
        {e:"📊",name:"Check spending",desc:"Review yesterday's expenses"},
        {e:"💸",name:"No impulse buys",desc:"Wait 24h on non-essentials"},
        {e:"📈",name:"Check investments",desc:"Brief portfolio review"},
        {e:"📝",name:"Track net worth",desc:"Monthly wealth snapshot"},
        {e:"🏦",name:"Save / invest",desc:"Pay yourself first"},
      ]
    },
    {
      id:"creative", name:"Creative Life", icon:"🎨", cat:"Creative",
      sub:"Express yourself daily",
      habits:[
        {e:"✍️",name:"Write 200 words",desc:"Any writing counts"},
        {e:"🎸",name:"Practice instrument",desc:"30 minutes of music"},
        {e:"🖌️",name:"Create something",desc:"Art, design, or craft"},
        {e:"📷",name:"Take a photo",desc:"Capture something beautiful"},
        {e:"💡",name:"One new idea",desc:"Write down an idea you had"},
      ]
    },
    {
      id:"social_growth", name:"Social Growth", icon:"🤝", cat:"Social",
      sub:"Build meaningful relationships",
      habits:[
        {e:"📞",name:"Call someone",desc:"Voice > text for real connection"},
        {e:"🙏",name:"Acts of kindness",desc:"Do something nice unprompted"},
        {e:"🎯",name:"Networking message",desc:"Reach out to someone new"},
        {e:"🌐",name:"Post on social",desc:"Share something valuable"},
        {e:"📆",name:"Plan a meetup",desc:"Schedule time with people"},
      ]
    },
    {
      id:"minimalist", name:"Minimalist Starter", icon:"🌱", cat:"Lifestyle",
      sub:"Just 3 habits. Life-changing.",
      habits:[
        {e:"💧",name:"Drink enough water",desc:"2+ liters per day"},
        {e:"🏃",name:"Move your body",desc:"Any exercise for 20+ minutes"},
        {e:"😴",name:"Get enough sleep",desc:"7–9 hours, consistent"},
      ]
    },
    {
      id:"night_routine", name:"Wind-Down Ritual", icon:"🌙", cat:"Health",
      sub:"End your day with intention",
      habits:[
        {e:"📵",name:"Screens off 1hr before bed",desc:"Blue light ruins sleep"},
        {e:"📖",name:"Read fiction",desc:"Escape and relax"},
        {e:"🛁",name:"Shower or bath",desc:"Signals sleep to your body"},
        {e:"📝",name:"Plan tomorrow",desc:"Brain dump before sleep"},
        {e:"🙏",name:"Reflect on the day",desc:"3 wins from today"},
      ]
    },
  ];

  const CATEGORIES = ["All", ...new Set(TEMPLATE_PACKS.map(p => p.cat))];
  let activeCategory = "All";

  const getExistingHabitNames = () => {
    if (!data[mk]?.tasks) return new Set();
    return new Set(data[mk].tasks.map(t => t.name.toLowerCase()));
  };

  const addHabit = (name, btn) => {
    if (!data[mk]) data[mk] = { tasks:[], monthStarted:true };
    const existing = getExistingHabitNames();
    if (existing.has(name.toLowerCase())) { toast("Already added!"); return; }

    const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
    const task = {
      id:          "t_" + Date.now() + "_" + Math.random().toString(36).slice(2,6),
      name,
      schedule:    "daily",
      days:        Array(31).fill("locked"),
      graceLimit:  1, graceUsed: 0,
      createdDay:  today.getDate() - 1,
      startDate:   today.toISOString(),
    };
    // Unlock from today forward
    for (let d = today.getDate()-1; d < daysInMonth; d++) task.days[d] = "unmarked";
    data[mk].tasks.push(task);
    saveData();

    btn.textContent = "✓ Added";
    btn.className   = "t-add-btn added";
    toast(`✓ "${name}" added to this month!`);
  };

  const addPack = (pack) => {
    const existing = getExistingHabitNames();
    let added = 0;
    pack.habits.forEach(h => {
      if (existing.has(h.name.toLowerCase())) return;
      if (!data[mk]) data[mk] = { tasks:[], monthStarted:true };
      const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
      const task = {
        id:         "t_" + Date.now() + Math.random().toString(36).slice(2,6),
        name:       h.name, schedule:"daily",
        days:       Array(31).fill("locked"),
        graceLimit:1, graceUsed:0,
        createdDay: today.getDate()-1,
        startDate:  today.toISOString(),
      };
      for (let d=today.getDate()-1; d<daysInMonth; d++) task.days[d]="unmarked";
      data[mk].tasks.push(task);
      added++;
    });
    saveData();
    toast(added > 0 ? `✓ Added ${added} habits from ${pack.name}!` : "All habits already added");
    renderPacks();
  };

  const renderTabs = () => {
    const el = document.getElementById("catTabs");
    el.innerHTML = CATEGORIES.map(c => `
      <button class="cat-tab ${c === activeCategory ? "active" : ""}"
        onclick="filterCat('${c}')">${c}</button>`).join("");
  };

  const filterCat = (cat) => { activeCategory = cat; renderTabs(); renderPacks(); };
  window.filterCat = filterCat;

  const renderPacks = () => {
    const packs  = TEMPLATE_PACKS.filter(p => activeCategory === "All" || p.cat === activeCategory);
    const existing = getExistingHabitNames();
    const area   = document.getElementById("packsArea");
    area.innerHTML = "";

    packs.forEach(pack => {
      const div = document.createElement("div");
      div.className = "pack";
      div.innerHTML = `
        <div class="pack-header">
          <div class="pack-icon">${pack.icon}</div>
          <div class="pack-info">
            <div class="pack-name">${pack.name}</div>
            <div class="pack-sub">${pack.sub}</div>
          </div>
          <button class="pack-add-all" onclick="addPackById('${pack.id}')">+ Add All</button>
        </div>
        <div class="pack-habits">
          ${pack.habits.map((h,i) => {
            const isAdded = existing.has(h.name.toLowerCase());
            return `
              <div class="t-habit-row">
                <div class="t-habit-emoji">${h.e}</div>
                <div class="t-habit-info">
                  <div class="t-habit-name">${h.name}</div>
                  <div class="t-habit-desc">${h.desc}</div>
                </div>
                <button class="t-add-btn ${isAdded?"added":""}"
                  onclick="addHabitByPackHabit('${pack.id}',${i},this)">
                  ${isAdded ? "✓ Added" : "+ Add"}
                </button>
              </div>`;
          }).join("")}
        </div>`;
      area.appendChild(div);
    });
  };

  window.addPackById = (id) => {
    const pack = TEMPLATE_PACKS.find(p => p.id === id);
    if (pack) addPack(pack);
  };

  window.addHabitByPackHabit = (packId, habitIdx, btn) => {
    const pack = TEMPLATE_PACKS.find(p => p.id === packId);
    if (!pack) return;
    addHabit(pack.habits[habitIdx].name, btn);
  };

  let _tt = null;
  const toast = (msg) => {
    const el = document.getElementById("tToast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove("show"), 2500);
  };

  renderTabs();
  renderPacks();
</script>
</body>
</html>
