  document.documentElement.setAttribute('data-theme', t);
  document.addEventListener('DOMContentLoaded', function() {
    document.body.setAttribute('data-theme', t);
  });
})();

  <meta charset="UTF-8" />
  <title>Achievements — Habit Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/themes.css" />

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ── HEADER ──────────────────────────────────── */
    .ach-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }

    .ach-header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 0;
    }

    .ach-header .sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      background: var(--bg-card, #1f1f1f);
      color: var(--text-main);
      border: 1px solid var(--border-soft);
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      background: var(--primary, #4CAF50);
      color: #fff;
      border-color: transparent;
    }

    /* Gem display */
    .gem-display {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* ── SUMMARY BAR ──────────────────────────────── */
    .summary-bar {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      padding: 16px 24px;
      background: var(--bg-panel, #121212);
      border-bottom: 1px solid var(--border-soft);
    }

    .summary-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-stat label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .summary-stat strong {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* ── MAIN LAYOUT ──────────────────────────────── */
    .ach-main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ── SECTION ──────────────────────────────────── */
    .ach-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── BADGE GRID ───────────────────────────────── */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    /* ── BADGE CARD ───────────────────────────────── */
    .badge-card {
      background: var(--bg-panel, #121212);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    .badge-card.unlocked {
      border-color: var(--badge-color, var(--done, #4ade80));
      box-shadow: 0 0 0 1px var(--badge-color, var(--done, #4ade80)),
                  0 4px 20px color-mix(in srgb, var(--badge-color, #4ade80) 25%, transparent);
    }

    .badge-card.unlocked:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 0 1px var(--badge-color, var(--done, #4ade80)),
                  0 12px 32px color-mix(in srgb, var(--badge-color, #4ade80) 35%, transparent);
    }

    .badge-card.locked {
      opacity: 0.45;
      filter: grayscale(1);
    }

    /* Top accent bar */
    .badge-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--badge-color, transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .badge-card.unlocked::before {
      opacity: 1;
    }

    /* NEW badge indicator */
    .badge-card .new-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #f59e0b;
      color: #000;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.06em;
    }

    .badge-icon {
      font-size: 2.6rem;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .badge-card.locked .badge-icon {
      filter: grayscale(1) brightness(0.5);
    }

    .badge-name {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .badge-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .badge-date {
      font-size: 0.68rem;
      color: var(--badge-color, var(--done, #4ade80));
      font-weight: 600;
      margin-top: 2px;
    }

    .badge-progress {
      width: 100%;
      height: 4px;
      background: var(--border-soft);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .badge-progress-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--badge-color, var(--done, #4ade80));
      transition: width 0.6s ease;
    }

    .badge-progress-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── SHARE BUTTON ─────────────────────────────── */
    .share-section {
      margin-top: 32px;
      background: var(--bg-panel, #121212);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .share-section h3 {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .share-section p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .share-preview {
      background: var(--bg-main);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      text-align: left;
      font-family: monospace;
      margin-bottom: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .share-btn {
      padding: 10px 24px;
      background: linear-gradient(135deg, var(--done, #4ade80), var(--primary, #4CAF50));
      color: #000;
      font-weight: 800;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .share-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74,222,128,0.4);
    }

    .copy-feedback {
      display: inline-block;
      margin-left: 12px;
      font-size: 0.8rem;
      color: var(--done, #4ade80);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-feedback.show { opacity: 1; }

    /* ── EMPTY STATE ──────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .emoji {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* ── RESPONSIVE ───────────────────────────────── */
    @media (max-width: 600px) {
      .badge-grid { grid-template-columns: repeat(2, 1fr); }
      .ach-header h1 { font-size: 1.3rem; }
    }

    /* ── UNLOCK ANIMATION ─────────────────────────── */
    @keyframes badge-pop {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }

    .badge-card.just-unlocked {
      animation: badge-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

</head>

  <script>
  /* ==============================================
     ACHIEVEMENTS PAGE — achievements.js (inline)
  ============================================== */

  const authUser = JSON.parse(localStorage.getItem("auth_user"));
  if (!authUser) window.location.href = "auth.html";

  const STORAGE_KEY = `habitTracker_${authUser.id}`;
  const data        = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  const gems        = data.gems || { total: 0, awardedDays: [], awardedMonths: [] };

  // Apply saved theme
  const savedTheme = localStorage.getItem("habitTheme") || "dark";
  document.body.setAttribute("data-theme", savedTheme);

  /* ── COMPUTE STATS FROM DATA ─────────────────── */
  const computeStats = () => {
    const TODAY   = new Date();
    const TOD_Y   = TODAY.getFullYear();
    const TOD_M   = TODAY.getMonth();
    const TOD_D   = TODAY.getDate();

    let totalHabits   = 0;
    let perfectDays   = new Set(); // "YYYY-MM-DD" keys
    let bestStreak    = 0;
    let allMonthKeys  = Object.keys(data).filter(k => k.match(/^\d{4}-\d{2}$/));

    // Collect all unique tasks ever added
    const habitNames = new Set();

    allMonthKeys.forEach(mk => {
      const [y, m]  = mk.split("-").map(Number);
      const month   = data[mk];
      if (!month?.tasks?.length) return;

      const days = new Date(y, m, 0).getDate(); // days in month

      month.tasks.forEach(task => {
        habitNames.add(task.name);

        for (let d = 0; d < days; d++) {
          const activeTasks = month.tasks.filter(t => t.days[d] !== "locked");
          if (!activeTasks.length) continue;

          const isPast =
            y < TOD_Y ||
            (y === TOD_Y && m - 1 < TOD_M) ||
            (y === TOD_Y && m - 1 === TOD_M && d < TOD_D - 1);

          const isToday = y === TOD_Y && m - 1 === TOD_M && d === TOD_D - 1;

          if (!isPast && !isToday) continue;

          const allDone = activeTasks.every(t => t.days[d] === "done");
          if (allDone) {
            perfectDays.add(`${y}-${String(m).padStart(2,"0")}-${String(d+1).padStart(2,"0")}`);
          }
        }
      });

      totalHabits += month.tasks.length;
    });

    // Compute best ALL-TIME streak across months
    // Walk every calendar day, check if all active tasks done
    let cur = 0, best = 0;
    const allDates = [];

    allMonthKeys.sort().forEach(mk => {
      const [y, m] = mk.split("-").map(Number);
      const days   = new Date(y, m, 0).getDate();
      const month  = data[mk];
      if (!month?.tasks?.length) return;

      for (let d = 0; d < days; d++) {
        const active = month.tasks.filter(t => t.days[d] !== "locked");
        if (!active.length) continue;

        const y2 = y, m2 = m - 1, d2 = d;
        const isPast =
          y2 < TOD_Y ||
          (y2 === TOD_Y && m2 < TOD_M) ||
          (y2 === TOD_Y && m2 === TOD_M && d2 < TOD_D - 1);
        const isToday = y2 === TOD_Y && m2 === TOD_M && d2 === TOD_D - 1;

        if (!isPast && !isToday) continue;

        const allDone = active.every(t => t.days[d] === "done");
        if (allDone) { cur++; best = Math.max(best, cur); }
        else cur = 0;
      }
    });

    bestStreak = best;

    return {
      perfectDayCount: perfectDays.size,
      bestStreak,
      totalGems: gems.total,
      totalHabits: habitNames.size,
      gemDays: (gems.awardedDays || []).length,
      lifetimeXP: (data.xp?.lifetimeXP) || 0,
    };
  };

  const STATS = computeStats();

  /* ── BADGE DEFINITIONS ───────────────────────── */
  // Each badge: { id, icon, name, desc, color, category, unlock(stats) → bool|{progress,max} }
  const BADGES = [

    // ── STREAK ────────────────────────────────────
    {
      id: "streak_3",   icon: "🔥", name: "On Fire",
      desc: "Maintain a 3-day streak",
      color: "#fb923c", category: "Streak",
      unlock: s => s.bestStreak >= 3  ? true : { progress: s.bestStreak, max: 3 }
    },
    {
      id: "streak_7",   icon: "💪", name: "Week Warrior",
      desc: "Maintain a 7-day streak",
      color: "#f97316", category: "Streak",
      unlock: s => s.bestStreak >= 7  ? true : { progress: s.bestStreak, max: 7 }
    },
    {
      id: "streak_14",  icon: "⚡", name: "Two Weeks Strong",
      desc: "Maintain a 14-day streak",
      color: "#ef4444", category: "Streak",
      unlock: s => s.bestStreak >= 14 ? true : { progress: s.bestStreak, max: 14 }
    },
    {
      id: "streak_30",  icon: "🏆", name: "Unstoppable",
      desc: "Maintain a 30-day streak",
      color: "#dc2626", category: "Streak",
      unlock: s => s.bestStreak >= 30 ? true : { progress: s.bestStreak, max: 30 }
    },

    // ── PERFECT DAYS ──────────────────────────────
    {
      id: "perfect_1",  icon: "⭐", name: "First Star",
      desc: "Complete all habits on 1 day",
      color: "#facc15", category: "Perfect Days",
      unlock: s => s.perfectDayCount >= 1  ? true : { progress: s.perfectDayCount, max: 1 }
    },
    {
      id: "perfect_5",  icon: "🌟", name: "Stellar",
      desc: "Complete all habits on 5 days",
      color: "#fbbf24", category: "Perfect Days",
      unlock: s => s.perfectDayCount >= 5  ? true : { progress: s.perfectDayCount, max: 5 }
    },
    {
      id: "perfect_10", icon: "✨", name: "Shining",
      desc: "Complete all habits on 10 days",
      color: "#f59e0b", category: "Perfect Days",
      unlock: s => s.perfectDayCount >= 10 ? true : { progress: s.perfectDayCount, max: 10 }
    },
    {
      id: "perfect_30", icon: "🌠", name: "Constellation",
      desc: "Complete all habits on 30 days",
      color: "#d97706", category: "Perfect Days",
      unlock: s => s.perfectDayCount >= 30 ? true : { progress: s.perfectDayCount, max: 30 }
    },

    // ── GEMS ──────────────────────────────────────
    {
      id: "gems_100",  icon: "💎", name: "Gem Collector",
      desc: "Earn your first 100 gems",
      color: "#a78bfa", category: "Gems",
      unlock: s => s.totalGems >= 100  ? true : { progress: s.totalGems, max: 100 }
    },
    {
      id: "gems_500",  icon: "💠", name: "Gem Hoarder",
      desc: "Accumulate 500 gems",
      color: "#8b5cf6", category: "Gems",
      unlock: s => s.totalGems >= 500  ? true : { progress: s.totalGems, max: 500 }
    },
    {
      id: "gems_1000", icon: "👑", name: "Gem King",
      desc: "Accumulate 1,000 gems",
      color: "#7c3aed", category: "Gems",
      unlock: s => s.totalGems >= 1000 ? true : { progress: s.totalGems, max: 1000 }
    },

    // ── MONTH COMPLETION ──────────────────────────
    {
      id: "month_80",  icon: "📅", name: "Solid Month",
      desc: "Complete a month with 80%+ average",
      color: "#34d399", category: "Month",
      unlock: s => (data.gems?.awardedMonths?.length || 0) >= 1
        ? true : { progress: data.gems?.awardedMonths?.length || 0, max: 1 }
    },
    {
      id: "month_3",   icon: "🗓️", name: "Hat Trick",
      desc: "Complete 3 months at 80%+",
      color: "#10b981", category: "Month",
      unlock: s => {
        const n = data.gems?.awardedMonths?.length || 0;
        return n >= 3 ? true : { progress: n, max: 3 };
      }
    },
    {
      id: "month_perfect", icon: "🎯", name: "Perfectionist",
      desc: "Complete a month with 100% average",
      color: "#059669", category: "Month",
      unlock: s => {
        // Check if any month has 100% stats
        const found = Object.keys(data)
          .filter(k => k.match(/^\d{4}-\d{2}$/))
          .some(mk => {
            const month = data[mk];
            if (!month?.tasks?.length) return false;
            const [y, m] = mk.split("-").map(Number);
            const days   = new Date(y, m, 0).getDate();
            const total  = month.tasks.reduce((sum, t) =>
              sum + t.days.slice(0, days).filter(d => d !== "locked").length, 0);
            const done   = month.tasks.reduce((sum, t) =>
              sum + t.days.slice(0, days).filter(d => d === "done").length, 0);
            return total > 0 && done === total;
          });
        return found ? true : { progress: 0, max: 1 };
      }
    },

    // ── HABIT COUNT ───────────────────────────────
    {
      id: "habits_1",  icon: "🌱", name: "First Step",
      desc: "Add your first habit",
      color: "#4ade80", category: "Habits",
      unlock: s => s.totalHabits >= 1  ? true : { progress: s.totalHabits, max: 1 }
    },
    {
      id: "habits_5",  icon: "🌿", name: "Growing",
      desc: "Add 5 different habits",
      color: "#22c55e", category: "Habits",
      unlock: s => s.totalHabits >= 5  ? true : { progress: s.totalHabits, max: 5 }
    },
    {
      id: "habits_10", icon: "🌳", name: "Habit Forest",
      desc: "Add 10 different habits",
      color: "#16a34a", category: "Habits",
      unlock: s => s.totalHabits >= 10 ? true : { progress: s.totalHabits, max: 10 }
    },
    {
      id: "habits_20", icon: "🌲", name: "Ecosystem",
      desc: "Add 20 different habits",
      color: "#15803d", category: "Habits",
      unlock: s => s.totalHabits >= 20 ? true : { progress: s.totalHabits, max: 20 }
    },

    // ── LEAGUES ───────────────────────────────────
    {
      id: "league_silver",   icon: "🥈", name: "Silver",
      desc: "Reach Silver League (300 lifetime XP)",
      color: "#94a3b8", category: "Leagues",
      unlock: s => s.lifetimeXP >= 300  ? true : { progress: s.lifetimeXP, max: 300 }
    },
    {
      id: "league_gold",     icon: "🥇", name: "Gold",
      desc: "Reach Gold League (800 lifetime XP)",
      color: "#facc15", category: "Leagues",
      unlock: s => s.lifetimeXP >= 800  ? true : { progress: s.lifetimeXP, max: 800 }
    },
    {
      id: "league_platinum", icon: "💠", name: "Platinum",
      desc: "Reach Platinum League (1,800 XP)",
      color: "#38bdf8", category: "Leagues",
      unlock: s => s.lifetimeXP >= 1800 ? true : { progress: s.lifetimeXP, max: 1800 }
    },
    {
      id: "league_diamond",  icon: "💎", name: "Diamond",
      desc: "Reach Diamond League (3,500 XP)",
      color: "#a78bfa", category: "Leagues",
      unlock: s => s.lifetimeXP >= 3500 ? true : { progress: s.lifetimeXP, max: 3500 }
    },
    {
      id: "league_obsidian", icon: "🌑", name: "Obsidian",
      desc: "Reach Obsidian League (6,000 XP)",
      color: "#6366f1", category: "Leagues",
      unlock: s => s.lifetimeXP >= 6000 ? true : { progress: s.lifetimeXP, max: 6000 }

<script>
// ── Trophies from Week Races ─────────────────────────────────────────
(function() {
  const au = JSON.parse(localStorage.getItem("auth_user")||"null");
  if (!au) return;
  const raw = JSON.parse(localStorage.getItem("habitTracker_"+au.id)||"{}");
  const trophies = (raw.trophies || []).slice().reverse(); // newest first
  if (!trophies.length) return;

  const container = document.getElementById("trophiesSection");
  if (!container) return;
  container.style.display = "block";

  const grid = document.getElementById("trophiesGrid");
  trophies.forEach(t => {
    const el = document.createElement("div");
    el.style.cssText = `background:linear-gradient(145deg,rgba(${t.rank===0?'245,158,11':t.rank===1?'156,163,175':'180,83,9'},0.1),rgba(0,0,0,0.2));border:1px solid ${t.color}44;border-radius:16px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative`;
    el.onmouseover = () => { el.style.transform="translateY(-3px)"; el.style.boxShadow=`0 8px 28px ${t.color}33`; };
    el.onmouseout  = () => { el.style.transform=""; el.style.boxShadow=""; };
    el.innerHTML = `
      <div style="font-size:2.4rem;margin-bottom:8px;filter:drop-shadow(0 0 12px ${t.color}66)">${t.emoji}</div>
      <div style="font-size:0.6rem;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:${t.color};margin-bottom:4px">${t.label}</div>
      <div style="font-size:0.82rem;font-weight:800;color:var(--text);margin-bottom:2px">${t.title}</div>
      <div style="font-size:0.65rem;color:var(--muted)">${t.week||""}</div>
      ${(()=>{
        // Extract epoch week from weekKey e.g. "habitRaceTrophy_3000"
        const wonWeekNum = t.weekKey ? parseInt(t.weekKey.split('_').pop()) : 0;
        const currentWeekNum = Math.floor(Date.now()/604800000);
        const raceOver = currentWeekNum > wonWeekNum;
        return raceOver
          ? `<button onclick="event.stopPropagation();shareTrophyFromBadges('${t.emoji}','${t.title}','${t.label}','${t.color}','${t.week||""}')" style="margin-top:10px;background:${t.color};color:#000;border:none;border-radius:8px;padding:5px 12px;font-size:0.65rem;font-weight:800;cursor:pointer;font-family:inherit">📸 Share</button>`
          : `<div style="margin-top:8px;font-size:0.58rem;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.04);border-radius:6px;padding:4px 8px">🔒 Share unlocks Monday</div>`;
      })()}
    `;
    grid.appendChild(el);
  });
})();

function shareTrophyFromBadges(emoji, title, label, color, weekLabel) {
  const canvas = document.createElement("canvas");
  const DPR = Math.min(window.devicePixelRatio||2,3);
  const W=480,H=480;
  canvas.width=W*DPR; canvas.height=H*DPR;
  const ctx=canvas.getContext("2d"); ctx.scale(DPR,DPR);
  const bg=ctx.createLinearGradient(0,0,W,H); bg.addColorStop(0,"#080f10"); bg.addColorStop(1,"#0d1a14");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const glow=ctx.createRadialGradient(W/2,H/2-30,20,W/2,H/2-30,160);
  glow.addColorStop(0,color+"33"); glow.addColorStop(1,"transparent");
  ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=color+"44"; ctx.lineWidth=2; ctx.strokeRect(2,2,W-4,H-4);
  ctx.font="bold 110px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(emoji,W/2,H/2-70);
  ctx.font="800 14px -apple-system,sans-serif"; ctx.fillStyle=color;
  ctx.fillText(label.toUpperCase(),W/2,H/2+30);
  ctx.font="900 28px -apple-system,sans-serif"; ctx.fillStyle="#fff";
  ctx.fillText(title,W/2,H/2+68);
  ctx.font="500 13px -apple-system,sans-serif"; ctx.fillStyle="rgba(255,255,255,0.4)";
  ctx.fillText(weekLabel,W/2,H/2+104);
  ctx.font="700 11px -apple-system,sans-serif"; ctx.fillStyle="rgba(255,255,255,0.15)";
  ctx.fillText("HabitTracker · habittracker.app",W/2,H-28);
  canvas.toBlob(blob=>{
    if(!blob) return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="trophy.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  },"image/png");
}
</script>
<script>
/* Smooth page transition */
(function() {
  document.body.style.opacity = "0";
  requestAnimationFrame(() => {
    document.body.style.transition = "opacity 0.22s ease";
    document.body.style.opacity = "1";
  });
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href]");
    if (!a) return;
    const href = a.getAttribute("href");
    if (!href || href.startsWith("http") || href.startsWith("#") || href.startsWith("javascript")) return;
    if (a.target === "_blank") return;
    e.preventDefault();
    document.body.style.transition = "opacity 0.16s ease";
    document.body.style.opacity = "0";
    setTimeout(() => { window.location.href = href; }, 160);
  });
})();

  /* ── INDIVIDUAL BADGE SHARE ──────────────────── */
  let _shareBadge = null;

  function openBadgeShare(badge) {
    _shareBadge = badge;
    document.getElementById('bsIcon').textContent = badge.icon;
    document.getElementById('bsName').textContent = badge.name;
    document.getElementById('bsDesc').textContent = badge.desc;
    const modal = document.getElementById('badgeShareModal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    renderBadgeCanvas(badge);
  }

  function closeBadgeShare() {
    document.getElementById('badgeShareModal').style.display = 'none';
    document.body.style.overflow = '';
  }

  function renderBadgeCanvas(badge) {
    const canvas = document.getElementById('badgeCanvas');
    const DPR = Math.min(window.devicePixelRatio || 2, 3);
    const W = 400, H = 400;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);

    const color = badge.color || '#10b981';

    // Background
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#080e10'); bg.addColorStop(1, '#0d1a14');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // Glow
    const glow = ctx.createRadialGradient(W/2, H/2 - 30, 10, W/2, H/2 - 30, 160);
    glow.addColorStop(0, color + '44'); glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // Outer ring
    ctx.save();
    ctx.beginPath(); ctx.arc(W/2, H/2 - 30, 100, 0, Math.PI * 2);
    ctx.strokeStyle = color + '66'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    // Inner ring
    ctx.save();
    ctx.beginPath(); ctx.arc(W/2, H/2 - 30, 85, 0, Math.PI * 2);
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.stroke(); ctx.restore();

    // Badge icon
    ctx.font = '80px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(badge.icon, W/2, H/2 - 30);

    // Badge name
    ctx.font = 'bold 26px system-ui';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'transparent';
    ctx.fillText(badge.name, W/2, H/2 + 82);

    // Badge desc
    ctx.font = '15px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(badge.desc, W/2, H/2 + 112);

    // App watermark
    ctx.font = 'bold 13px system-ui';
    ctx.fillStyle = color + 'aa';
    ctx.fillText('Habit Tracker ·  My Achievements', W/2, H - 22);
  }

  function downloadBadge() {
    if (!_shareBadge) return;
    const canvas = document.getElementById('badgeCanvas');
    const link = document.createElement('a');
    link.download = 'badge-' + (_shareBadge.id || 'achievement') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  async function shareBadgeNative() {
    if (!_shareBadge) return;
    const canvas = document.getElementById('badgeCanvas');
    const btn = document.getElementById('bsNativeBtn');
    try {
      if (navigator.share && navigator.canShare) {
        canvas.toBlob(async function(blob) {
          const file = new File([blob], 'badge.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'I earned the ' + _shareBadge.name + ' badge!',
              text: _shareBadge.desc + ' — Habit Tracker'
            });
          } else {
            downloadBadge();
          }
        }, 'image/png');
      } else {
        downloadBadge();
      }
    } catch(e) {
      if (e.name !== 'AbortError') downloadBadge();
    }
  }

  // Close modal on backdrop click
  document.getElementById('badgeShareModal').addEventListener('click', function(e) {
    if (e.target === this) closeBadgeShare();
  });

</script>

<!-- ── BADGE SHARE MODAL ─────────────────────────── -->
<div id="badgeShareModal" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.85);backdrop-filter:blur(16px);align-items:center;justify-content:center;padding:20px;box-sizing:border-box">
  <div style="background:#0d0d14;border-radius:24px;width:min(380px,96vw);padding:24px;border:1px solid rgba(255,255,255,0.08);position:relative">
    <button onclick="closeBadgeShare()" style="position:absolute;top:14px;right:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:0.9rem;font-family:inherit">✕</button>
    <div style="text-align:center;margin-bottom:16px">
      <div id="bsIcon" style="font-size:3rem;line-height:1;margin-bottom:8px"></div>
      <div id="bsName" style="font-size:1.1rem;font-weight:900;color:#fff;margin-bottom:4px"></div>
      <div id="bsDesc" style="font-size:0.78rem;color:rgba(255,255,255,0.45)"></div>
    </div>
    <canvas id="badgeCanvas" style="width:100%;border-radius:16px;display:block;margin-bottom:14px"></canvas>
    <div style="display:flex;gap:10px">
      <button onclick="downloadBadge()" style="flex:1;padding:12px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:12px;font-weight:800;font-size:0.85rem;cursor:pointer;font-family:inherit">⬇ Save Image</button>
      <button onclick="shareBadgeNative()" id="bsNativeBtn" style="flex:1;padding:12px;background:rgba(255,255,255,0.07);color:#fff;border:1px solid rgba(255,255,255,0.12);border-radius:12px;font-weight:800;font-size:0.85rem;cursor:pointer;font-family:inherit">📤 Share</button>
    </div>
  </div>
</div>
</body>
</html>
