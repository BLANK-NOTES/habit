<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Year Wrapped</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#09090f;
  --text:#eeeef5;
  --muted:rgba(255,255,255,0.5);
}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  font-family:'DM Sans',sans-serif;
  background:#09090f;
  color:var(--text);
  touch-action:pan-y;
}

/* ══ SLIDE SYSTEM ══ */
.slides{
  position:fixed;inset:0;
  overflow:hidden;
}

.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;
  text-align:center;
  opacity:0;
  transform:translateY(100%);
  transition:transform 0.6s cubic-bezier(0.76,0,0.24,1), opacity 0.6s ease;
  pointer-events:none;
  overflow:hidden;
}
.slide.active{
  opacity:1;transform:translateY(0);pointer-events:all;
}
.slide.exit{
  opacity:0;transform:translateY(-100%);
}

/* ══ BACKGROUNDS ══ */
.slide-1{ background:linear-gradient(160deg, #0d0015 0%, #1a0030 40%, #0a1a40 100%); }
.slide-2{ background:linear-gradient(160deg, #001a00 0%, #003300 40%, #001a10 100%); }
.slide-3{ background:linear-gradient(160deg, #1a0d00 0%, #2d1500 50%, #1a0a10 100%); }
.slide-4{ background:linear-gradient(160deg, #00101a 0%, #001830 50%, #0a0020 100%); }
.slide-5{ background:linear-gradient(160deg, #1a0010 0%, #2a0020 50%, #0a0015 100%); }
.slide-6{ background:linear-gradient(160deg, #0a0a00 0%, #1a1a00 50%, #0a0a10 100%); }
.slide-7{ background:linear-gradient(160deg, #000a1a 0%, #001428 50%, #00081a 100%); }
.slide-8{ background:linear-gradient(160deg, #1a0000 0%, #2a0808 50%, #0a001a 100%); }
.slide-9{ background:radial-gradient(ellipse at 50% 20%, #1a0040 0%, #0a0a0a 70%); }

/* Animated mesh background */
.slide::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, var(--s-accent1, rgba(120,80,255,0.15)), transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 70%, var(--s-accent2, rgba(0,200,150,0.12)), transparent 60%);
  pointer-events:none;
  animation:meshMove 8s ease-in-out infinite alternate;
}
@keyframes meshMove{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(5%,3%) scale(1.05);}
}

/* ══ TYPOGRAPHY ══ */
.eyebrow{
  font-family:'DM Sans',sans-serif;
  font-size:0.65rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.18em;
  color:rgba(255,255,255,0.4);
  margin-bottom:18px;
  animation:fadeUp 0.5s ease 0.1s both;
}
.big-number{
  font-family:'Syne',sans-serif;
  font-size:clamp(4rem,18vw,7rem);
  font-weight:900;
  line-height:0.9;
  margin-bottom:16px;
  animation:numberIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
}
.slide-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(1.6rem,5vw,2.4rem);
  font-weight:800;
  line-height:1.15;
  margin-bottom:14px;
  animation:fadeUp 0.5s ease 0.3s both;
}
.slide-sub{
  font-size:clamp(0.85rem,2.5vw,1rem);
  color:rgba(255,255,255,0.6);
  line-height:1.6;
  max-width:320px;
  animation:fadeUp 0.5s ease 0.4s both;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes numberIn{
  from{opacity:0;transform:scale(0.5);}
  to{opacity:1;transform:scale(1);}
}

/* ══ ACCENT COLORS PER SLIDE ══ */
.slide-1 .big-number,.slide-1 .highlight{ color:#c084fc; }
.slide-2 .big-number,.slide-2 .highlight{ color:#4ade80; }
.slide-3 .big-number,.slide-3 .highlight{ color:#fb923c; }
.slide-4 .big-number,.slide-4 .highlight{ color:#60a5fa; }
.slide-5 .big-number,.slide-5 .highlight{ color:#f472b6; }
.slide-6 .big-number,.slide-6 .highlight{ color:#facc15; }
.slide-7 .big-number,.slide-7 .highlight{ color:#06b6d4; }
.slide-8 .big-number,.slide-8 .highlight{ color:#f87171; }
.slide-9 .big-number,.slide-9 .highlight{ color:#a78bfa; }

/* ══ HABIT BARS ══ */
.habit-bars{
  width:100%;max-width:340px;
  display:flex;flex-direction:column;gap:10px;
  margin:16px 0;
  animation:fadeUp 0.5s ease 0.4s both;
}
.hbar{display:flex;align-items:center;gap:10px;}
.hbar-name{font-size:0.8rem;font-weight:700;width:110px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,0.8);}
.hbar-track{flex:1;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:5px;transition:width 1.2s cubic-bezier(0.34,1.1,0.64,1);}
.hbar-pct{font-size:0.72rem;font-weight:800;width:34px;text-align:left;flex-shrink:0;}

/* ══ MOOD CHART ══ */
.mood-wave{
  display:flex;align-items:flex-end;justify-content:center;
  gap:6px;height:80px;width:100%;max-width:340px;margin:16px 0;
  animation:fadeUp 0.5s ease 0.5s both;
}
.mood-col{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.mood-bar-seg{width:100%;border-radius:4px 4px 0 0;min-height:3px;}
.mood-emoji-lbl{font-size:0.9rem;}

/* ══ HEATMAP ══ */
.mini-heatmap{
  display:flex;flex-wrap:wrap;gap:3px;
  width:100%;max-width:340px;
  justify-content:center;
  margin:16px 0;
  animation:fadeUp 0.5s ease 0.5s both;
}
.hm{
  width:12px;height:12px;border-radius:2px;
  background:rgba(255,255,255,0.06);
}
.hm.l1{background:rgba(167,139,250,0.3);}
.hm.l2{background:rgba(167,139,250,0.55);}
.hm.l3{background:rgba(167,139,250,0.8);}
.hm.l4{background:#a78bfa;}

/* ══ STAT PILLS ══ */
.stat-pills{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  margin:16px 0;
  animation:fadeUp 0.5s ease 0.5s both;
}
.pill{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;padding:8px 16px;
  font-size:0.8rem;font-weight:700;
}

/* ══ FINAL SLIDE ══ */
.trophy-row{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  margin:16px 0;
  animation:fadeUp 0.5s ease 0.5s both;
}
.trophy{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;padding:16px;
  text-align:center;min-width:90px;
}
.trophy-icon{font-size:1.8rem;margin-bottom:6px;}
.trophy-val{font-size:1rem;font-weight:900;}
.trophy-lbl{font-size:0.6rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}

/* ══ CONFETTI ══ */
.confetti-piece{
  position:fixed;top:-10px;
  width:8px;height:8px;
  border-radius:2px;
  animation:confettiFall linear forwards;
  pointer-events:none;z-index:999;
}
@keyframes confettiFall{
  to{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

/* ══ NAV ══ */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  padding:20px 24px 28px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:100;
  background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
}
.nav-dots{display:flex;gap:6px;}
.nav-dot{
  width:6px;height:6px;border-radius:3px;
  background:rgba(255,255,255,0.25);
  transition:all 0.3s;
}
.nav-dot.active{background:#fff;width:18px;}
.nav-next{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;border-radius:20px;
  padding:10px 20px;font-size:0.85rem;font-weight:700;
  cursor:pointer;transition:all 0.2s;
  font-family:'DM Sans',sans-serif;
}
.nav-next:hover{background:rgba(255,255,255,0.25);transform:scale(1.04);}
.nav-back{
  background:none;border:none;color:rgba(255,255,255,0.3);
  font-size:0.82rem;cursor:pointer;padding:10px;
  font-family:'DM Sans',sans-serif;
}
.nav-back:hover{color:rgba(255,255,255,0.6);}

/* ══ PARTICLES ══ */
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.particle{
  position:absolute;border-radius:50%;
  animation:particleDrift linear infinite;
  opacity:0.4;
}
@keyframes particleDrift{
  from{transform:translateY(100vh) scale(0);}
  to{transform:translateY(-10vh) scale(1);}
}

/* ══ YEAR SELECTOR ══ */
.year-select{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;color:#fff;
  font-size:0.88rem;font-weight:700;
  padding:6px 12px;outline:none;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  animation:fadeUp 0.5s ease 0.6s both;
}

/* ══ BIG EMOJI ══ */
.big-emoji{
  font-size:clamp(3rem,12vw,5rem);
  margin-bottom:12px;
  display:block;
  animation:emojiPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.15s both;
}
@keyframes emojiPop{from{transform:scale(0) rotate(-10deg);}to{transform:scale(1) rotate(0deg);}}
</style>
</head>
<body>

<div class="slides" id="slides">
  <!-- Slides injected by JS -->
</div>

<nav class="nav">
  <button class="nav-back" id="backBtn" onclick="prevSlide()">← Back</button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-next" id="nextBtn" onclick="nextSlide()">Next →</button>
</nav>

<script>
/* ── Auth & data ── */
const authUser = JSON.parse(localStorage.getItem("auth_user"));
if (!authUser) window.location.href = "auth.html";

const STORAGE_KEY = `habitTracker_${authUser.id}`;
const rawData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

/* ── Year picker ── */
const currentYear = new Date().getFullYear();
let selectedYear  = currentYear;

/* ── Compute yearly stats ── */
const computeYear = (year) => {
  const stats = {
    year,
    totalDone: 0, totalActive: 0,
    perfectDays: 0, totalDays: 0,
    longestStreak: 0, currentStreak: 0,
    habitMap: {},
    moodCounts: {5:0,4:0,3:0,2:0,1:0},
    moodTotal: 0,
    bestMonth: null, bestMonthPct: 0,
    worstMonth: null, worstMonthPct: 101,
    mostConsistentHabit: null,
    hardestHabit: null,
    totalXP: rawData.xp?.lifetimeXP || 0,
    level: rawData.xp?.level || 1,
    gems: rawData.gems?.total || 0,
    loginStreak: rawData.loginStreak?.count || 0,
    monthlyPcts: [],
  };

  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  for (let mo = 0; mo < 12; mo++) {
    const mk    = `${year}-${String(mo+1).padStart(2,"0")}`;
    const mData = rawData[mk];
    if (!mData?.tasks?.length) { stats.monthlyPcts.push(null); continue; }

    const days = mData.tasks[0].days.length;
    let mDone = 0, mActive = 0, mPerfect = 0;

    for (let d = 0; d < days; d++) {
      const active = mData.tasks.filter(t => t.days[d] !== "locked");
      const done   = active.filter(t => t.days[d] === "done");
      if (!active.length) continue;
      mActive += active.length; mDone += done.length;
      stats.totalActive += active.length; stats.totalDone += done.length;
      stats.totalDays++;
      if (done.length === active.length) { mPerfect++; stats.perfectDays++; }
    }

    const pct = mActive ? Math.round(mDone/mActive*100) : 0;
    stats.monthlyPcts.push({ mo, label:MONTHS[mo], pct, perfect:mPerfect });

    if (pct > stats.bestMonthPct)  { stats.bestMonthPct  = pct; stats.bestMonth  = MONTHS[mo]; }
    if (pct < stats.worstMonthPct && pct > 0) { stats.worstMonthPct = pct; stats.worstMonth = MONTHS[mo]; }

    // Per-habit stats
    mData.tasks.forEach(t => {
      if (!stats.habitMap[t.name]) stats.habitMap[t.name] = { done:0, active:0 };
      const ha = t.days.filter(s=>s!=="locked");
      stats.habitMap[t.name].active += ha.length;
      stats.habitMap[t.name].done   += t.days.filter(s=>s==="done").length;
    });
  }

  // Mood
  Object.entries(rawData.moods || {}).forEach(([dk, m]) => {
    if (dk.startsWith(year+"") && m?.val) {
      stats.moodCounts[m.val]++;
      stats.moodTotal++;
    }
  });

  // Best/worst habit
  const ranked = Object.entries(stats.habitMap)
    .filter(([,h]) => h.active >= 5)
    .map(([name,h]) => ({ name, pct: Math.round(h.done/h.active*100) }))
    .sort((a,b) => b.pct - a.pct);

  stats.mostConsistentHabit = ranked[0] || null;
  stats.hardestHabit        = ranked[ranked.length-1] || null;
  stats.topHabits           = ranked.slice(0, 5);
  stats.overallPct          = stats.totalActive ? Math.round(stats.totalDone/stats.totalActive*100) : 0;

  // Dominant mood
  const topMood = Object.entries(stats.moodCounts).sort((a,b)=>b[1]-a[1])[0];
  const MOOD_LABELS = {5:"Amazing 🤩",4:"Good 😊",3:"Okay 😐",2:"Low 😔",1:"Rough 😫"};
  stats.dominantMood = topMood[1] > 0 ? MOOD_LABELS[topMood[0]] : null;

  return stats;
};

/* ── Build slides data ── */
const buildSlides = (stats) => {
  const name  = authUser.displayName || authUser.username || "You";
  const year  = stats.year;
  const pct   = stats.overallPct;
  const grade = pct >= 85 ? "Legendary" : pct >= 70 ? "Strong" : pct >= 50 ? "Solid" : pct > 0 ? "Building" : "Just Starting";

  return [
    /* 0 — Intro */
    {
      cls: "slide-1",
      accent1: "rgba(192,132,252,0.15)", accent2: "rgba(0,200,150,0.1)",
      html: `
        <div class="eyebrow">${name}'s ${year} · Habit Tracker</div>
        <div class="big-emoji">✨</div>
        <div class="slide-title">Your <span class="highlight">${year}</span><br>Wrapped</div>
        <div class="slide-sub">A look back at everything you built this year. Swipe to see your story.</div>
        <div style="margin-top:24px;animation:fadeUp 0.5s ease 0.6s both">
          <select class="year-select" id="yearSelect" onchange="changeYear(this.value)">
            ${[currentYear, currentYear-1, currentYear-2].map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}
          </select>
        </div>`,
    },
    /* 1 — Habits done */
    {
      cls: "slide-2",
      accent1: "rgba(74,222,128,0.15)", accent2: "rgba(0,200,80,0.1)",
      html: `
        <div class="eyebrow">Total habits completed</div>
        <div class="big-number">${stats.totalDone.toLocaleString()}</div>
        <div class="slide-title">habits<br><span class="highlight">done.</span></div>
        <div class="slide-sub">That's ${stats.totalDone.toLocaleString()} individual wins stacked across the year.</div>
        <div class="stat-pills" style="margin-top:20px">
          <div class="pill">📅 ${stats.totalDays} days tracked</div>
          <div class="pill">⚡ ${stats.overallPct}% completion</div>
        </div>`,
    },
    /* 2 — Perfect days */
    {
      cls: "slide-3",
      accent1: "rgba(251,146,60,0.15)", accent2: "rgba(200,100,0,0.1)",
      html: `
        <div class="eyebrow">Days where you nailed everything</div>
        <div class="big-number">${stats.perfectDays}</div>
        <div class="slide-title">perfect<br><span class="highlight">days.</span></div>
        <div class="slide-sub">${stats.perfectDays === 0 ? "Not yet — but every day is a new shot at it." : stats.perfectDays < 10 ? "Every perfect day is a serious achievement." : stats.perfectDays < 30 ? "That's genuinely impressive consistency." : "An absolutely elite level of dedication."}
        ${stats.bestMonth ? `<br><br>Your best month was <strong>${stats.bestMonth}</strong>.` : ""}</div>`,
    },
    /* 3 — Top habits */
    {
      cls: "slide-4",
      accent1: "rgba(96,165,250,0.12)", accent2: "rgba(0,150,200,0.1)",
      html: `
        <div class="eyebrow">Your most consistent habits</div>
        <div class="slide-title" style="margin-bottom:8px">Your <span class="highlight">top<br>performers</span></div>
        <div class="habit-bars" id="habitBarsEl">
          ${stats.topHabits.length ? stats.topHabits.map(h => `
            <div class="hbar">
              <div class="hbar-name">${h.name}</div>
              <div class="hbar-track"><div class="hbar-fill" style="width:0%;background:#60a5fa" data-w="${h.pct}"></div></div>
              <div class="hbar-pct" style="color:#60a5fa">${h.pct}%</div>
            </div>`).join("") : '<div style="color:rgba(255,255,255,0.4);font-size:0.85rem">Add habits to see your top performers</div>'}
        </div>`,
      onEnter: () => {
        setTimeout(() => {
          document.querySelectorAll(".hbar-fill").forEach(el => {
            el.style.width = el.dataset.w + "%";
          });
        }, 100);
      }
    },
    /* 4 — Mood */
    {
      cls: "slide-5",
      accent1: "rgba(244,114,182,0.15)", accent2: "rgba(200,0,100,0.1)",
      html: `
        <div class="eyebrow">How you felt in ${year}</div>
        <div class="slide-title">Your <span class="highlight">mood</span><br>in numbers</div>
        <div class="mood-wave">
          ${[{v:5,e:"🤩",c:"#4ade80"},{v:4,e:"😊",c:"#a3e635"},{v:3,e:"😐",c:"#facc15"},{v:2,e:"😔",c:"#fb923c"},{v:1,e:"😫",c:"#f87171"}].map(m => {
            const cnt = stats.moodCounts[m.v] || 0;
            const h   = stats.moodTotal > 0 ? Math.round((cnt/stats.moodTotal)*72) : 4;
            return `<div class="mood-col">
              <div style="font-size:0.7rem;color:rgba(255,255,255,0.5);margin-bottom:3px">${cnt}</div>
              <div class="mood-bar-seg" style="height:${h}px;background:${m.c}"></div>
              <div class="mood-emoji-lbl">${m.e}</div>
            </div>`;
          }).join("")}
        </div>
        <div class="slide-sub">${stats.dominantMood ? `Your dominant mood this year was <strong>${stats.dominantMood}</strong>.` : "No mood data logged yet. Start tracking daily!"}</div>`,
    },
    /* 5 — Streak & XP */
    {
      cls: "slide-6",
      accent1: "rgba(250,204,21,0.15)", accent2: "rgba(200,150,0,0.08)",
      html: `
        <div class="eyebrow">Dedication in numbers</div>
        <div class="big-emoji">⚡</div>
        <div class="slide-title"><span class="highlight">${stats.totalXP.toLocaleString()}</span><br>XP earned</div>
        <div class="stat-pills">
          <div class="pill">🏆 Level ${stats.level}</div>
          <div class="pill">🔥 ${stats.loginStreak} day streak</div>
          <div class="pill">💎 ${stats.gems} gems</div>
        </div>
        <div class="slide-sub" style="margin-top:8px">Every point of XP is a habit completed, a day shown up.</div>`,
    },
    /* 6 — Heatmap */
    {
      cls: "slide-7",
      accent1: "rgba(6,182,212,0.12)", accent2: "rgba(0,120,200,0.1)",
      html: `
        <div class="eyebrow">Your activity across the year</div>
        <div class="slide-title">Your <span class="highlight">year<br>in squares</span></div>
        <div class="mini-heatmap" id="heatmapEl"></div>
        <div class="slide-sub">${stats.overallPct >= 70 ? "That's a lot of green. Well done." : "Every filled square is a day you chose to show up."}</div>`,
      onEnter: () => {
        const el = document.getElementById("heatmapEl");
        if (!el) return;
        for (let mo=0;mo<12;mo++) {
          const mk    = `${stats.year}-${String(mo+1).padStart(2,"0")}`;
          const mData = rawData[mk];
          const days  = new Date(stats.year, mo+1, 0).getDate();
          for (let d=0;d<days;d++) {
            const cell = document.createElement("div");
            cell.className = "hm";
            if (mData?.tasks?.length) {
              const active = mData.tasks.filter(t=>t.days[d]!=="locked");
              const done   = active.filter(t=>t.days[d]==="done").length;
              const pct    = active.length ? done/active.length : 0;
              if (pct >= 1)    cell.classList.add("l4");
              else if (pct>=.75) cell.classList.add("l3");
              else if (pct>=.5)  cell.classList.add("l2");
              else if (pct>0)    cell.classList.add("l1");
            }
            el.appendChild(cell);
          }
        }
      }
    },
    /* 7 — Grade */
    {
      cls: "slide-8",
      accent1: "rgba(248,113,113,0.12)", accent2: "rgba(200,0,50,0.1)",
      html: `
        <div class="eyebrow">Your ${year} grade</div>
        <div class="big-emoji">${pct >= 85 ? "🏆" : pct >= 70 ? "💪" : pct >= 50 ? "✅" : "🌱"}</div>
        <div class="big-number" style="font-size:clamp(3rem,14vw,5.5rem)">${grade}</div>
        <div class="slide-title">${pct}% <span class="highlight">completion<br>rate</span></div>
        <div class="slide-sub">${
          pct >= 85 ? "Absolute elite. Most people dream about consistency like this." :
          pct >= 70 ? "Strong and reliable. This is the foundation good habits are built on." :
          pct >= 50 ? "More than half the battle won. Now push past the halfway line." :
          pct > 0   ? "You started. That's the hardest part. Now build on it." :
          "Next year is your year. Start with one habit."
        }</div>`,
    },
    /* 8 — Final */
    {
      cls: "slide-9",
      accent1: "rgba(167,139,250,0.15)", accent2: "rgba(100,80,200,0.1)",
      html: `
        <div class="eyebrow">See you in ${year+1}</div>
        <div class="big-emoji">🚀</div>
        <div class="slide-title">Keep going,<br><span class="highlight">${name}.</span></div>
        <div class="trophy-row">
          <div class="trophy">
            <div class="trophy-icon">✅</div>
            <div class="trophy-val">${stats.totalDone.toLocaleString()}</div>
            <div class="trophy-lbl">Done</div>
          </div>
          <div class="trophy">
            <div class="trophy-icon">⭐</div>
            <div class="trophy-val">${stats.perfectDays}</div>
            <div class="trophy-lbl">Perfect</div>
          </div>
          <div class="trophy">
            <div class="trophy-icon">⚡</div>
            <div class="trophy-val">${stats.totalXP.toLocaleString()}</div>
            <div class="trophy-lbl">XP</div>
          </div>
        </div>
        <div class="slide-sub" style="margin-bottom:20px">Every habit is a vote for the person you're becoming.</div>
        <a href="monthly.html" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:20px;padding:12px 28px;font-weight:700;font-size:0.9rem;text-decoration:none;display:inline-block;font-family:'DM Sans',sans-serif;transition:all 0.2s;animation:fadeUp 0.5s ease 0.6s both"
          onmouseover="this.style.background='rgba(255,255,255,0.25)'"
          onmouseout="this.style.background='rgba(255,255,255,0.15)'">
          Back to Dashboard →
        </a>`,
      onEnter: () => launchConfetti(),
    },
  ];
};

/* ── Slide engine ── */
let slides = [];
let current = 0;

const renderSlides = (stats) => {
  slides = buildSlides(stats);
  const container = document.getElementById("slides");
  container.innerHTML = "";

  slides.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = `slide ${s.cls}`;
    el.style.setProperty("--s-accent1", s.accent1 || "rgba(120,80,255,0.15)");
    el.style.setProperty("--s-accent2", s.accent2 || "rgba(0,200,150,0.12)");
    el.innerHTML = `<div class="particles" id="particles${i}"></div>` + s.html;
    container.appendChild(el);

    // Floating particles
    setTimeout(() => buildParticles(i, s.accent1), i * 50);
  });

  goTo(0);
  renderDots();
};

const buildParticles = (idx, color) => {
  const el = document.getElementById(`particles${idx}`);
  if (!el) return;
  const c = (color || "rgba(120,80,255,0.3)").replace(/[\d.]+\)$/, "0.5)");
  for (let i=0;i<8;i++) {
    const p = document.createElement("div");
    p.className = "particle";
    const size = 3 + Math.random() * 5;
    p.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;
      background:${c};
      animation-duration:${6+Math.random()*8}s;
      animation-delay:${Math.random()*6}s;
    `;
    el.appendChild(p);
  }
};

const goTo = (idx) => {
  const all = document.querySelectorAll(".slide");
  all.forEach((el, i) => {
    el.classList.remove("active", "exit");
    if (i < idx) el.classList.add("exit");
    if (i === idx) el.classList.add("active");
  });
  current = idx;
  renderDots();
  document.getElementById("backBtn").style.opacity = idx === 0 ? "0" : "1";
  document.getElementById("nextBtn").textContent = idx === slides.length-1 ? "← Home" : "Next →";
  // Run onEnter callback
  slides[idx]?.onEnter?.();
};

const nextSlide = () => {
  if (current >= slides.length - 1) { window.location.href = "monthly.html"; return; }
  goTo(current + 1);
};
const prevSlide = () => { if (current > 0) goTo(current - 1); };

const renderDots = () => {
  document.getElementById("navDots").innerHTML =
    slides.map((_, i) => `<div class="nav-dot${i===current?" active":""}"></div>`).join("");
};

/* ── Swipe support ── */
let touchY = null;
document.addEventListener("touchstart", e => { touchY = e.touches[0].clientY; });
document.addEventListener("touchend", e => {
  if (touchY === null) return;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dy) > 50) { dy < 0 ? nextSlide() : prevSlide(); }
  touchY = null;
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowRight") nextSlide();
  if (e.key === "ArrowUp"   || e.key === "ArrowLeft")  prevSlide();
});

/* ── Year change ── */
const changeYear = (yr) => {
  selectedYear = parseInt(yr);
  const stats = computeYear(selectedYear);
  renderSlides(stats);
};
window.changeYear = changeYear;

/* ── Confetti ── */
const launchConfetti = () => {
  const colors = ["#c084fc","#4ade80","#fb923c","#60a5fa","#f472b6","#facc15","#06b6d4","#f87171"];
  for (let i=0;i<60;i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.cssText = `
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>0.5?"50%":"2px"};
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*1.5}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
};

/* ── Init ── */
const stats = computeYear(currentYear);
renderSlides(stats);
</script>
</body>
</html>
